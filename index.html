  await anim(430, p => { fctx.clearRect(0, 0, VW, VH); if (Math.floor(p * 6) % 2 === 0) { fctx.fillStyle = 'rgba(255,255,255,.8)'; fctx.fillRect(0, 0, VW, VH); } });
  await anim(kind === 'spiral' ? 760 : 560, p => {
    fctx.clearRect(0, 0, VW, VH); fctx.fillStyle = DARK;
    if (kind === 'spiral') { const n = Math.floor(p * SP.length); for (let i = 0; i < n; i++) fctx.fillRect(SP[i][0] * 16, SP[i][1] * 16, 16, 16); }
    else if (kind === 'bars') for (let i = 0; i < VH / 16; i++) { const w = Math.ceil(p * VW); fctx.fillRect(i % 2 ? VW - w : 0, i * 16, w, 16); }
    else { const h = Math.ceil(p * VH / 2); fctx.fillRect(0, 0, VW, h); fctx.fillRect(0, VH - h, VW, h); for (let i = 0; i < 6; i++) { const w = Math.ceil(p * VW / 2); fctx.fillRect(i % 2 ? VW - w : 0, VH / 2 - 52 + i * 18, w, 6); } }
  });
  fctx.fillStyle = DARK; fctx.fillRect(0, 0, VW, VH);
}
const reveal = () => anim(420, p => { fctx.clearRect(0, 0, VW, VH); fctx.fillStyle = DARK; const h = Math.floor(VH / 2 * (1 - p)); fctx.fillRect(0, 0, VW, h); fctx.fillRect(0, VH - h, VW, h); });
async function vsBanner(b) {
  const v = el('div', 'vs', '<div class="va">' + porImg('av' + S.av, 'enojo') + '<b>' + esc(S.name.toUpperCase()) + '</b></div><i>VS</i><div class="vb">' + porImg(b.ch, 'picaro') + '<b>' + esc(CH[b.ch].n) + '</b><small>' + esc(b.title + ' · ' + CARDS[b.th].n) + '</small></div>');
  topEl.appendChild(v);
  AU.sfx.rank();
  await wait(1900);
  v.remove();
}

/* ---------- lugares y personajes ---------- */
async function travel(side) {
  const to = ORDER[ORDER.indexOf(M.id) + (side === 'east' ? 1 : -1)];
  if (!to) return;
  await fade(1); enter(to, side === 'east' ? 'west' : 'east'); await fade(0);
  if (M.def.guide && !S.flags['g_' + M.id]) await lesson();
}
async function leaveGym() { await fade(1); enter(S.ret.map, S.ret); await fade(0); }
async function door(k) {
  const b = M.blds[k];
  if (k === 'G') { AU.sfx.ok(); await fade(1); S.ret = { map: M.id, x: b.door.x, y: b.door.y + 1 }; enter('gym:' + M.id, 'entry'); await fade(0); }
  else if (k === 'L') {
    S.hp = maxHp(); S.resp = { map: M.id, x: b.door.x, y: b.door.y + 1 }; AU.sfx.good(); hud();
    await lines(['::Entras a la BIBLIOTECA y repasas tus apuntes con calma. Tu *autorización* vuelve a estar completa.', 'ousia:alegre:(Ousía hojea un libro al revés. Si pierdes una disputa, volverás aquí.)']);
  } else await lines(['::' + (M.def.houses[k] || 'La puerta está cerrada.')]);
}
async function pick(it) { S.taken[M.id + ':' + it.i] = 1; it.off = true; await lines(['::Encuentras un libro entre el pasto. Tiene algo subrayado.']); await give(it.id); }
/* la guía de la región: plantea el problema y deja elegir la postura inicial */
async function lesson() {
  const g = M.def.guide, n = M.npcs.find(x => x.def.guide);
  if (n) { n.dir = 'left'; P.dir = 'right'; }
  await lines(g.l);
  const i = await choose(g.offer.map(k => ({ t: CARDS[k].n, s: CARDS[k].by, ic: ideaImg(k) })), { cls: 'page', title: 'ELIGE TU POSTURA · ' + PROB[M.def.prob].q, cancel: false, detail: j => '<div class="cd"><p>' + fmt(CARDS[g.offer[j]].d) + '</p><h4>TE COMPROMETES A</h4><ul>' + li(CARDS[g.offer[j]].cl) + '</ul></div>' });
  const th = g.offer[i];
  S.pos[M.def.prob] = th;
  await give(th);
  for (const c of g.gift) await give(c);
  if (g.arg && g.arg[th]) await give(g.arg[th]);
  S.flags['g_' + M.id] = 1;
  await lines(g.out);
  if (n) n.dir = n.def.d || 'down';
}
async function intro() {
  await lines(INTRO);
  await give('compromiso'); await give('paraf');
  S.flags.intro = 1;
  await lines(INTRO2);
}
async function talk(n) {
  const d = n.def;
  n.dir = OPP[P.dir];
  if (d.bt) { await duel(n); return; }
  if (d.guide && !S.flags['g_' + M.id]) { await lesson(); return; }
  await lines(d.l, d.ch);
  if (d.gift) await give(d.gift);
}
async function spotted(n) {
  n.bang = true; AU.sfx.hint(); await wait(650); n.bang = false;
  const v = DV[n.dir];
  while (n.x + v[0] !== P.x || n.y + v[1] !== P.y) await walk(n, n.x + v[0], n.y + v[1]);
  P.dir = OPP[n.dir];
  await duel(n);
}
async function duel(n) {
  const id = n.def.bt, b = BT[id], prob = CARDS[b.th].p;
  if (S.beaten[id]) { await lines([b.ch + ':neutral:' + b.after]); return; }
  if (id === 'carnap' && Object.keys(S.badges).length < 8) { await lines(['carnap:neutral:Vuelva cuando tenga los ocho sellos. Antes de eso no hay nada sobre lo que podamos disputar.']); return; }
  await lines([b.ch + ':picaro:' + b.pre]);
  if (S.pos[prob] === b.th) {
    /* misma postura: sin incompatibilidad no hay disputa */
    await lines([b.ch + ':alegre:¡Un momento! Tú también defiendes *' + CARDS[b.th].n + '*. Entre quienes comparten compromisos no hay nada que disputar.', 'ousia:picaro:(Ousía asiente: sin incompatibilidad no hay disputa.)']);
    S.beaten[id] = 1;
    for (const c of b.rw || []) await give(c);
    return;
  }
  const won = await battle(id);
  if (won && id === 'carnap') { S.flags.fin = 1; await lines(ENDING); }
}

/* ---------- disputas ---------- */
function scene(kc, wildId) {
  const root = el('div', 'battle', '<div class="sky"></div><div class="plat pf"></div><div class="plat pm"></div>' +
    '<div class="fig foe">' + (wildId ? ideaImg(wildId) : '<canvas width="48" height="48"></canvas>') + '</div>' +
    '<div class="fig me"><canvas width="48" height="48"></canvas></div><div class="fig ou"><canvas width="48" height="48"></canvas></div>' +
    '<div class="bx fbox"><div class="r1"><b></b><i></i></div><div class="th"></div><div class="bar"><i></i></div></div>' +
    '<div class="bx mbox"><div class="r1"><b></b><i></i></div><div class="th"></div><div class="bar"><i></i></div><div class="hp"></div></div>' +
    '<div class="bmsg"><div class="tx"></div><i class="nx" hidden>▼</i></div>');
  root.style.setProperty('--kc', kc);
  const q = s => $(s, root);
  const sc = {
    root, q, foeC: q('.foe canvas'), meC: q('.me canvas'), ouC: q('.ou canvas'), box: { tx: q('.bmsg .tx'), nx: q('.bmsg .nx') },
    say: (t, v) => typeText(sc.box, t, v),
    bar(side, hp, max) {
      const r = Math.max(0, Math.min(1, hp / max)), i = q('.' + side + ' .bar i');
      i.style.width = (r * 100) + '%'; i.className = r > .5 ? '' : r > .2 ? 'mid' : 'low';
      if (side === 'mbox') q('.mbox .hp').textContent = Math.max(0, Math.ceil(hp)) + ' / ' + max;
    },
    hit(side) { const f = q('.' + side); f.classList.remove('hit'); void f.offsetWidth; f.classList.add('hit'); }
  };
  setPor(sc.meC, 'yo', 'neutral'); setPor(sc.ouC, 'ousia', 'neutral');
  q('.mbox b').textContent = S.name.toUpperCase(); q('.mbox .r1 i').textContent = 'Nv ' + level();
  return sc;
}
async function shot(sc, to, id) {
  const s = el('div', 'shot to-' + to, ideaImg(id));
  sc.root.appendChild(s);
  await wait(430);
  s.remove(); sc.hit(to);
}
/* preguntas de «pedir razones» sacadas de los compromisos de una teoría */
function autoProbes(th) {
  const T = CARDS[th];
  return [
    { c: T.cl[0], q: '¿Cuál de estas afirmaciones es *incompatible* con lo que sostiene?', o: [T.inc[0], T.cl[1], T.cl[2]], ok: 'Quien defiende ' + T.n + ' no puede aceptar eso: su marcador lo excluye.' },
    { c: T.cl[1], q: '¿A qué más queda comprometido quien afirma eso?', o: [T.cl[2], T.inc[1], T.inc[0]], ok: 'Ese compromiso viene con la postura; los otros dos son incompatibles con ella.' }
  ];
}
function scoreHtml(mine, theirs) {
  const col = (who, id) => '<div><h4>' + who + '</h4><b>' + esc(CARDS[id].n) + '</b><ul>' + li(CARDS[id].cl) + '</ul></div>';
  return '<div class="cd score">' + col('TU POSTURA', mine) + col('SU POSTURA', theirs) + '</div>';
}
async function battle(id) {
  const b = BT[id], foe = CH[b.ch], prob = CARDS[b.th].p, lead = !!b.lead, kIdx = PORDER.indexOf(prob);
  let my = S.pos[prob] || Object.keys(CARDS).find(k => CARDS[k].t === 'T' && CARDS[k].p === prob && k !== b.th);
  const st = { fhp: b.hp, used: {}, fused: {}, cused: {}, atk: 1, def: 1, probes: shuffle(b.probes || autoProbes(b.th)), hinted: false, last: 0 };
  mode = 'battle'; hudEl.hidden = true;
  AU.sfx.start();
  await transition(lead ? 'shut' : 'spiral');
  AU.play(lead ? 'leader' : 'battle');
  if (lead) await vsBanner(b);
  const sc = scene(PROB[prob].c), mx = maxHp();
  S.hp = Math.min(S.hp, mx);
  sc.q('.fbox b').textContent = foe.n; sc.q('.fbox .r1 i').textContent = b.title || '';
  sc.q('.fbox .th').textContent = CARDS[b.th].n;
  const upd = () => { sc.bar('fbox', st.fhp, b.hp); sc.bar('mbox', S.hp, mx); sc.q('.mbox .th').textContent = CARDS[my].n; };
  const face = (who, emo) => setPor(who === 'foe' ? sc.foeC : who === 'me' ? sc.meC : sc.ouC, who === 'foe' ? b.ch : who === 'me' ? 'yo' : 'ousia', emo);
  const ou = async (emo, t) => { face('ou', emo); await sc.say(t, 'ou'); };
  face('foe', 'picaro');
  ui.appendChild(sc.root); upd();
  await reveal();
  await sc.say('¡' + (b.title ? b.title + ' ' : '') + foe.n + ' quiere disputar!');
  await sc.say('Defiende *' + CARDS[b.th].n + '*: «' + CARDS[b.th].cl[0] + '» Tú sostienes *' + CARDS[my].n + '*.');
  if (!S.flags.tutB) {
    S.flags.tutB = 1;
    await ou('alegre', '(Ousía te explica con gestos.) *ARGÜIR*: lanza un argumento. Solo es eficaz si es una objeción contra la postura de tu rival.');
    await ou('pensar', '*PEDIR RAZONES*: examina un compromiso del rival. *CONCEPTO*: prepara una distinción. *POSTURA*: mira el marcador o cambia de teoría.');
    await ou('picaro', 'Cuando te objeten podrás *replicar* con el concepto adecuado. Y con SELECT me pides una pista.');
  }

  const argue = async () => {
    const ids = Object.keys(S.cards).filter(k => CARDS[k].t === 'A' && (CARDS[k].p === prob || CARDS[k].p === 'gen' || CARDS[k].vs[b.th] || CARDS[k].vs[my]));
    if (!ids.length) { await sc.say('Todavía no tienes argumentos para este problema. Búscalos en la hierba alta… o prueba a *PEDIR RAZONES*.'); return false; }
    const tagOf = k => (S.known[k + '>' + my] === 'self' ? 'self' : S.known[k + '>' + b.th]);
    const i = await choose(ids.map(k => { const kn = tagOf(k); return { t: CARDS[k].n, ic: ideaImg(k), tag: kn ? KN[kn] : '?', tc: kn || 'unk' }; }),
      { cls: 'detail', title: 'ARGÜIR contra ' + CARDS[b.th].n, detail: j => cardHtml(ids[j], 1) });
    if (i < 0) return false;
    const k = ids[i], A = CARDS[k], n = st.used[k] || 0;
    st.used[k] = n + 1;
    face('me', 'neutral');
    await sc.say('*' + S.name + '* arguye: *' + A.n + '*.');
    if (A.vs[my]) {
      S.hp -= 12; S.known[k + '>' + my] = 'self';
      await shot(sc, 'me', k); face('me', 'sorpresa'); face('ou', 'duda'); AU.sfx.bad(); upd();
      await sc.say('¡Incoherencia! *' + A.n + '* es una objeción contra *' + CARDS[my].n + '*, tu propia postura. Pierdes autorización. (−12)');
    } else {
      const v = A.vs[b.th] || 0, stab = v && (A.pro || []).includes(my);
      let d = (v === 2 ? 30 : v === 1 ? 18 : 5) * st.atk * Math.pow(.6, n) * (1 + .04 * (level() - 1)) * (stab ? 1.2 : 1);
      const rp = v ? (A.rep || []).find(r => (b.reps || []).includes(r)) : null, replied = !!rp && Math.random() < (lead ? .7 : .4);
      if (replied) d *= .5;
      d = Math.max(1, Math.round(d)); st.fhp -= d;
      S.known[k + '>' + b.th] = v === 2 ? 'dec' : v === 1 ? 'per' : 'graze';
      await shot(sc, 'foe', k);
      if (v) { AU.sfx.hit(); face('foe', v === 2 ? 'sorpresa' : 'duda'); face('ou', 'alegre'); } else { AU.sfx.no(); face('foe', 'picaro'); face('ou', 'duda'); }
      upd();
      await sc.say((v === 2 ? '¡Objeción decisiva contra *' + CARDS[b.th].n + '*!' : v === 1 ? 'Objeción pertinente.' : 'No es una objeción contra *' + CARDS[b.th].n + '*: apenas roza su postura.') +
        (stab ? ' Y encaja con tu propia postura.' : '') + (n ? ' Repetirlo no lo vuelve más fuerte.' : '') + ' (−' + d + ')');
      if (replied) {
        face('foe', 'picaro'); S.seen[rp] = 1;
        await sc.say(foe.n + ' replica con *' + CARDS[rp].n + '*: ' + CARDS[rp].d, foe.v);
        await sc.say('La réplica amortiguó tu objeción a la mitad.');
      }
    }
    st.atk = 1;
    return true;
  };
  const probe = async () => {
    if (!st.probes.length) { await sc.say('Ya examinaste todos sus compromisos.'); return false; }
    const p = st.probes.shift();
    await sc.say('*' + S.name + '* pide razones.');
    face('foe', 'pensar');
    await sc.say(foe.n + ' afirma: «' + p.c + '»', foe.v);
    const o = shuffle(p.o.map((t, i) => ({ t, ok: i === 0 })));
    const i = await choose(o.map(x => ({ t: x.t })), { cls: 'full', title: p.q, cancel: false });
    if (o[i].ok) {
      const d = Math.round(22 * (1 + .04 * (level() - 1))); st.fhp -= d;
      face('foe', 'sorpresa'); face('ou', 'alegre'); AU.sfx.good(); sc.hit('foe'); upd();
      await sc.say('¡Marcador actualizado! ' + p.ok + ' (−' + d + ')');
    } else {
      S.hp -= 8; face('me', 'duda'); face('foe', 'picaro'); AU.sfx.bad(); sc.hit('me'); upd();
      await sc.say('Hombre de paja: eso no es lo que se sigue de su compromiso. Lo correcto era: «' + p.o[0] + '» (−8 para ti)');
    }
    return true;
  };
  const concept = async () => {
    const ids = Object.keys(S.cards).filter(k => CARDS[k].t === 'C' && (CARDS[k].p === prob || CARDS[k].p === 'gen'));
    if (!ids.length) { await sc.say('No tienes conceptos para este problema.'); return false; }
    const i = await choose(ids.map(k => ({ t: CARDS[k].n, ic: ideaImg(k), dis: !!st.cused[k], tag: FXN[CARDS[k].fx], tc: 'fx' })), { cls: 'detail', title: 'CONCEPTO', detail: j => cardHtml(ids[j], 1) });
    if (i < 0) return false;
    const C = CARDS[ids[i]]; st.cused[ids[i]] = 1;
    AU.sfx.star(); face('me', 'pensar');
    let msg;
    if (C.fx === 'prec') { st.atk = 1.5; msg = 'Tu próximo argumento será más preciso: pegará un 50 % más.'; }
    else if (C.fx === 'dist') { st.def = .5; msg = 'Hecha la distinción, la próxima objeción te afectará la mitad.'; }
    else { const h = Math.max(0, Math.min(mx - S.hp, 22)); S.hp += h; msg = 'Aclaras tu posición y recuperas ' + h + ' de autorización.'; }
    upd();
    await sc.say('*' + S.name + '* introduce el concepto *' + C.n + '*. ' + msg);
    return true;
  };
  const stance = async () => {
    const ths = Object.keys(S.cards).filter(k => CARDS[k].t === 'T' && CARDS[k].p === prob && k !== b.th && k !== my);
    ths.unshift(my);
    const i = await choose(ths.map(k => ({ t: CARDS[k].n, ic: ideaImg(k), tag: k === my ? 'ACTUAL' : 'CAMBIAR', tc: k === my ? 'fx' : 'unk' })), { cls: 'detail', title: 'POSTURA · marcador de compromisos', detail: j => scoreHtml(ths[j], b.th) });
    if (i <= 0) return false;
    my = ths[i]; S.pos[prob] = my; face('me', 'pensar'); upd();
    await sc.say('Te retractas y adoptas *' + CARDS[my].n + '*. Cambiar de postura con razones no es perder: es disputar bien.');
    return true;
  };
  const hint = async () => {
    if (st.hinted) { await ou('duda', '(Ousía ya te dio su pista en esta disputa.)'); return; }
    st.hinted = true;
    const good = Object.keys(S.cards).find(k => CARDS[k].t === 'A' && CARDS[k].vs[b.th] === 2 && !CARDS[k].vs[my] && !st.used[k]);
    if (good) await ou('picaro', '(Ousía señala *' + CARDS[good].n + '*: es una objeción directa contra ' + CARDS[b.th].n + '.)');
    else if (st.probes.length) await ou('pensar', '(Ousía hace un gesto de pregunta: *PEDIR RAZONES* puede exponer los compromisos de tu rival.)');
    else await ou('duda', '(Ousía se encoge de hombros… si es que tiene hombros. Quizá te falte atrapar algún argumento.)');
  };
  const foeTurn = async () => {
    let best = null, bs = -1e9;
    b.deck.filter(a => !CARDS[a].vs[b.th]).forEach(a => { const s = (CARDS[a].vs[my] || 0) * 10 - (st.fused[a] || 0) * 7 + Math.random() * (lead ? 4 : 9); if (s > bs) { bs = s; best = a; } });
    const A = CARDS[best], v = A.vs[my] || 0, n = st.fused[best] || 0;
    st.fused[best] = n + 1; S.seen[best] = 1;
    face('foe', 'neutral');
    await sc.say(foe.n + ' objeta: *' + A.n + '*.');
    await sc.say('«' + A.d + '»', foe.v);
    let d = (v === 2 ? 28 : v === 1 ? 17 : 5) * b.pw * st.def * Math.pow(.7, n), msg, good = false;
    if (!v) msg = 'La objeción no alcanza a *' + CARDS[my].n + '*: apenas te roza.';
    else {
      const cs = Object.keys(S.cards).filter(k => CARDS[k].t === 'C' && (CARDS[k].p === prob || CARDS[k].p === 'gen' || (A.rep || []).includes(k)));
      let pk = -1;
      if (cs.length) pk = await choose(cs.map(k => ({ t: CARDS[k].n, ic: ideaImg(k) })).concat([{ t: 'Asumir el costo', s: 'no replicar' }]),
        { cls: 'detail', title: '¿CÓMO REPLICAS? · ' + A.n, cancel: false, detail: j => (j < cs.length ? cardHtml(cs[j], 1) : '<div class="cd"><p>Aceptas la objeción y pagas su costo completo. A veces no hay réplica a mano, y reconocerlo también es jugar limpio.</p></div>') });
      const k = pk >= 0 && pk < cs.length ? cs[pk] : null;
      if (k && (A.rep || []).includes(k)) { d *= .3; good = true; msg = '¡Buena réplica! *' + CARDS[k].n + '* responde a la objeción.'; }
      else if (k) { d += 3; msg = '*' + CARDS[k].n + '* no responde a esta objeción: entra completa.'; }
      else msg = v === 2 ? 'Encajas una objeción decisiva.' : 'Encajas la objeción.';
    }
    d = Math.max(1, Math.round(d)); S.hp -= d; st.def = 1;
    await shot(sc, 'me', best);
    if (good) { AU.sfx.good(); face('me', 'picaro'); face('ou', 'alegre'); face('foe', 'duda'); }
    else if (v) { AU.sfx.hit(); face('me', v === 2 ? 'sorpresa' : 'duda'); face('ou', S.hp < mx * .35 ? 'triste' : 'sorpresa'); face('foe', 'alegre'); }
    else face('me', 'picaro');
    upd();
    await sc.say(msg + ' (−' + d + ')');
  };

  const ACTS = [{ t: 'ARGÜIR' }, { t: 'PEDIR RAZONES' }, { t: 'CONCEPTO' }, { t: 'POSTURA' }];
  let result = null;
  while (!result) {
    sc.box.tx.innerHTML = fmt('¿Qué hará *' + S.name + '*?');
    const a = await choose(ACTS, { cls: 'grid', cols: 2, cancel: false, idx: st.last, keys: { select: () => 9 } });
    if (a < 4) st.last = a;
    const acted = a === 0 ? await argue() : a === 1 ? await probe() : a === 2 ? await concept() : a === 3 ? await stance() : (await hint(), false);
    if (!acted) continue;
    if (st.fhp <= 0) result = 'win';
    else if (S.hp <= 0) result = 'lose';
    else { await foeTurn(); if (S.hp <= 0) result = 'lose'; }
  }
  const won = result === 'win';
  if (won) {
    face('foe', 'triste'); face('me', 'alegre'); face('ou', 'alegre'); AU.play('win');
    await sc.say('¡' + foe.n + ' se queda sin autorización para sostener su tesis!');
    await sc.say(foe.n + ': «' + b.win + '»', foe.v);
    const xp = b.xp || (lead ? 80 + 15 * kIdx : 28 + 6 * kIdx), l0 = level();
    S.xp += xp; S.beaten[id] = 1;
    let msg = 'Ganas ' + xp + ' puntos de rigor.';
    if (level() > l0) { S.hp = maxHp(); msg += ' ¡Tu rigor sube al nivel ' + level() + ' y tu autorización máxima aumenta!'; }
    await sc.say(msg);
    if (b.badge) { S.badges[b.badge] = 1; AU.sfx.rank(); await sc.say('¡Recibes ' + (b.boss ? 'la' : 'el') + ' *' + PROB[b.badge].sello + '*!'); }
    for (const c of [b.th].concat(b.rw || [])) await give(c);
  } else {
    face('me', 'triste'); face('foe', 'alegre'); face('ou', 'triste'); AU.sfx.over();
    await sc.say('Te quedaste sin autorización para sostener tu postura…');
    await sc.say('Perder una disputa también enseña: ahora sabes qué objeciones te faltó responder.');
  }
  await fade(1);
  sc.root.remove(); mode = 'world'; hudEl.hidden = false;
  if (won) AU.play(M.def.song); else { S.hp = maxHp(); enter(S.resp.map, S.resp); }
  refresh();
  await fade(0);
  if (!won) await lines(['ousia:triste:(Ousía te trajo hasta la biblioteca. Repasar un rato te devolvió la autorización.)']);
  return won;
}

/* ---------- ideas salvajes ---------- */
const firstSent = d => { const i = d.indexOf('. '); return i < 0 ? d : d.slice(0, i + 1); };
function quiz(id) {
  const C = CARDS[id], all = Object.keys(CARDS);
  const pad = (same, rest) => shuffle(same).concat(shuffle(rest)).slice(0, 2);
  if (C.t === 'T') return { q: '¿Cuál de estos compromisos adquiere quien defiende *' + C.n + '*?', o: [C.cl[rnd(3)], C.inc[0], C.inc[1]], ok: 'Ese compromiso viene con la teoría; los otros dos son incompatibles con ella.' };
  if (C.t === 'A') {
    const tg = Object.keys(C.vs).sort((a, b) => C.vs[b] - C.vs[a])[0], ths = all.filter(k => CARDS[k].t === 'T' && !C.vs[k]);
    return { q: '¿Contra qué postura es una objeción *' + C.n + '*?', ok: 'Es una objeción contra ' + CARDS[tg].n + '.',
      o: [CARDS[tg].n].concat(pad(ths.filter(k => CARDS[k].p === CARDS[tg].p), ths.filter(k => CARDS[k].p !== CARDS[tg].p)).map(k => CARDS[k].n)) };
  }
  const r = repliedBy(id);
  if (r.length) {
    const args = all.filter(k => CARDS[k].t === 'A' && !(CARDS[k].rep || []).includes(id));
    return { q: '¿A cuál de estas objeciones permite replicar *' + C.n + '*?', ok: 'Con ' + C.n + ' se responde a ' + CARDS[r[0]].n + '.',
      o: [CARDS[r[0]].n].concat(pad(args.filter(k => CARDS[k].p === C.p), args.filter(k => CARDS[k].p !== C.p)).map(k => CARDS[k].n)) };
  }
  const cs = all.filter(k => CARDS[k].t === 'C' && k !== id);
  return { hide: 1, q: '¿Cuál de estas es la idea de *' + C.n + '*?', ok: C.d,
    o: [firstSent(C.d)].concat(pad(cs.filter(k => CARDS[k].p === C.p), cs.filter(k => CARDS[k].p !== C.p)).map(k => firstSent(CARDS[k].d))) };
}
async function wild(id) {
  const C = CARDS[id], q = quiz(id);
  mode = 'battle'; hudEl.hidden = true;
  AU.sfx.start();
  await transition('bars');
  AU.play('wild');
  const sc = scene(PROB[C.p].c, id), mx = maxHp();
  sc.root.classList.add('wild');
  sc.q('.fbox b').textContent = C.n.toUpperCase(); sc.q('.fbox .r1 i').textContent = TYPE[C.t].n; sc.q('.fbox .th').textContent = PROB[C.p].n + (C.by ? ' · ' + C.by : '');
  sc.q('.mbox .th').textContent = S.pos[C.p] ? CARDS[S.pos[C.p]].n : 'Sin postura';
  sc.bar('fbox', 1, 1); sc.bar('mbox', S.hp, mx);
  ui.appendChild(sc.root);
  await reveal();
  S.seen[id] = 1;
  await sc.say(TYPE[C.t].w);
  if (!q.hide) await sc.say('*' + C.n + '*: «' + C.d + '»');
  else await sc.say('Es *' + C.n + '*. Se queda mirándote, esperando a ver si lo entiendes.');
  if (!S.flags.tutW) { S.flags.tutW = 1; setPor(sc.ouC, 'ousia', 'pensar'); await sc.say('(Ousía te mira: si entiendes la idea, se quedará contigo en el ONTODEX.)', 'ou'); }
  const o = shuffle(q.o.map((t, i) => ({ t, ok: i === 0 })));
  const i = await choose(o.map(x => ({ t: x.t })), { cls: 'full', title: q.q, cancel: false });
  if (o[i].ok) {
    AU.sfx.good(); setPor(sc.meC, 'yo', 'alegre'); setPor(sc.ouC, 'ousia', 'alegre'); sc.q('.foe').classList.add('caught');
    S.xp += 8;
    await sc.say('¡Entendido! ' + q.ok);
    await give(id);
  } else {
    AU.sfx.bad(); setPor(sc.meC, 'yo', 'duda'); setPor(sc.ouC, 'ousia', 'triste'); sc.q('.foe').classList.add('fled');
    await sc.say('No era eso… Lo correcto: «' + q.o[0] + '»');
    await sc.say('*' + C.n + '* se escabulle entre la hierba. Volverá a aparecer.');
  }
  await fade(1);
  sc.root.remove(); mode = 'world'; hudEl.hidden = false; AU.play(M.def.song); refresh();
  await fade(0);
}

/* ---------- menú START ---------- */
async function ontodex() {
  let pi = Math.max(0, PORDER.indexOf(M.def.prob)), idx = 0;
  for (;;) {
    const prob = PORDER[pi], ids = Object.keys(CARDS).filter(k => CARDS[k].p === prob).sort((a, b) => 'TAC'.indexOf(CARDS[a].t) - 'TAC'.indexOf(CARDS[b].t));
    const have = ids.filter(k => S.cards[k]).length;
    const r = await choose(ids.map(k => ({ t: S.cards[k] || S.seen[k] ? CARDS[k].n : '? ? ?', ic: S.cards[k] ? ideaImg(k) : '<i class="noidea"></i>', dis: !S.cards[k], tag: TYPE[CARDS[k].t].n[0], tc: 't' + CARDS[k].t })),
      { cls: 'page', idx, title: 'ONTODEX ◀ ' + PROB[prob].n.toUpperCase() + ' ▶ ' + have + '/' + ids.length, detail: j => cardHtml(ids[j]), keys: { L: () => 'L', R: () => 'R', left: () => 'L', right: () => 'R', A: () => undefined } });
    if (r === 'L') { pi = (pi + PORDER.length - 1) % PORDER.length; idx = 0; }
    else if (r === 'R') { pi = (pi + 1) % PORDER.length; idx = 0; }
    else return;
  }
}
function sysHtml(p, sys) {
  const T = CARDS[S.pos[p]];
  const pair = (x, cls) => '<li class="' + cls + '"><b>' + esc(CARDS[x[0]].n) + ' + ' + esc(CARDS[x[1]].n) + '</b> ' + esc(x[2]) + '</li>';
  return '<div class="cd"><div class="chd">' + ideaImg(S.pos[p]) + '<div><i class="chip tT">' + esc(PROB[p].q) + '</i><h3>' + esc(T.n) + '</h3></div></div><ul>' + li(T.cl) + '</ul>' +
    '<h4>COHERENCIA DE TU SISTEMA (' + (sys.bonus >= 0 ? '+' : '') + sys.bonus + ' de autorización)</h4>' +
    (sys.syn.length || sys.ten.length ? '<ul class="sys">' + sys.syn.map(x => pair(x, 'ok')).join('') + sys.ten.map(x => pair(x, 'bad')).join('') + '</ul>' : '<p class="dim">Por ahora tus posturas ni se apoyan ni se estorban entre sí.</p>') + '</div>';
}
async function sistema() {
  let idx = 0;
  for (;;) {
    const probs = PORDER.filter(p => p !== 'gen' && S.pos[p]);
    if (!probs.length) { await lines(['ousia:duda:(Aún no tienes posturas. Las elegirás al llegar a cada pueblo.)']); return; }
    const sys = system();
    const i = await choose(probs.map(p => ({ t: PROB[p].n, s: CARDS[S.pos[p]].n })), { cls: 'page', idx, title: 'MI SISTEMA · ' + epithet(), detail: j => sysHtml(probs[j], sys) });
    if (i < 0) return;
    idx = i;
    const p = probs[i], ths = Object.keys(S.cards).filter(k => CARDS[k].t === 'T' && CARDS[k].p === p);
    if (ths.length < 2) { await lines(['ousia:pensar:(Solo tienes una teoría sobre este problema. Vence a quienes defienden otras y te las enseñarán.)']); continue; }
    const j = await choose(ths.map(k => ({ t: CARDS[k].n, ic: ideaImg(k), tag: k === S.pos[p] ? 'ACTUAL' : '', tc: 'fx' })), { cls: 'page', title: 'TU POSTURA SOBRE ' + PROB[p].n.toUpperCase(), detail: n => cardHtml(ths[n]) });
    if (j >= 0) { S.pos[p] = ths[j]; S.hp = Math.min(S.hp, maxHp()); AU.sfx.star(); hud(); save(); }
  }
}
async function sellos() {
  const ps = PORDER.filter(p => p !== 'gen');
  await choose(ps.map(p => ({ t: PROB[p].sello, s: PROB[p].n, tag: S.badges[p] ? '★' : '—', tc: S.badges[p] ? 'dec' : 'unk', dis: !S.badges[p] })), { cls: 'page', title: 'SELLOS DEL SER', keys: { A: () => undefined },
    detail: j => { const r = REG.find(x => x.prob === ps[j]), l = BT[r.gym ? r.gym.l : 'carnap']; return '<div class="cd"><h3>' + esc(PROB[ps[j]].sello) + '</h3><p>' + esc(PROB[ps[j]].q) + '</p><h4>LO ENTREGA</h4><p>' + esc(CH[l.ch].n) + ', en ' + esc(r.n) + '.</p>' + (S.badges[ps[j]] ? '<p class="dim">¡Ya es tuyo!</p>' : '') + '</div>'; } });
}
function applyVol() { AU.set({ mv: S.mv, sv: S.sv, voice: S.sv > 0 }); if (mbtn) mbtn.classList.toggle('off', S.mv <= 0 && S.sv <= 0); }
async function opciones() {
  let idx = 0;
  for (;;) {
    const i = await choose([{ t: 'Música', tag: S.mv > 0 ? 'SÍ' : 'NO', tc: S.mv > 0 ? 'dec' : 'unk' }, { t: 'Efectos y voces', tag: S.sv > 0 ? 'SÍ' : 'NO', tc: S.sv > 0 ? 'dec' : 'unk' }, { t: 'Borrar la partida' }, { t: 'Volver' }], { cls: 'side', idx, title: 'OPCIONES' });
    idx = Math.max(0, i);
    if (i === 0) { S.mv = S.mv > 0 ? 0 : 0.1; applyVol(); save(); }
    else if (i === 1) { S.sv = S.sv > 0 ? 0 : 0.7; applyVol(); save(); }
    else if (i === 2) {
      const c = await choose([{ t: 'No, conservarla' }, { t: 'Sí, borrar todo' }], { cls: 'side', title: '¿Borrar la partida?' });
      if (c === 1) { try { localStorage.removeItem(KEY); } catch (e) { /* sin almacenamiento */ } location.reload(); return; }
    } else return;
  }
}
async function menu() {
  let idx = 0;
  for (;;) {
    const all = Object.keys(CARDS).length, own = Object.keys(S.cards).length;
    const i = await choose([{ t: 'ONTODEX', s: own + ' de ' + all + ' cartas' }, { t: 'MI SISTEMA', s: epithet() }, { t: 'SELLOS', s: Object.keys(S.badges).length + ' de 9' }, { t: 'OPCIONES' }, { t: 'VOLVER AL MAPA' }],
      { cls: 'side', idx, title: S.name.toUpperCase() + ' · Rigor nv. ' + level() });
    idx = Math.max(0, i);
    if (i === 0) await ontodex(); else if (i === 1) await sistema(); else if (i === 2) await sellos(); else if (i === 3) await opciones(); else return;
  }
}

/* ---------- portada y partida nueva ---------- */
function start() {
  mode = 'world'; hudEl.hidden = false;
  enter(S.map, { x: S.x, y: S.y, dir: S.dir });
  fade(0);
  if (!S.flags.intro) run(intro);
}
async function newGame() {
  S = Object.assign(fresh(), { mv: S.mv, sv: S.sv });
  const bg = el('div', 'black');
  ui.insertBefore(bg, ui.firstChild);
  await lines(['sofia:alegre:¡Hola! Te doy la bienvenida al mundo de la METAFÍSICA.', 'sofia:neutral:Me llamo Sofía, aunque todos me dicen la PROFE. Estudio qué hay, y cómo es lo que hay.', 'sofia:pensar:Antes de empezar, cuéntame: ¿cómo te ves?']);
  S.av = await choose([0, 1, 2, 3, 4, 5].map(i => ({ t: '', ic: porImg('av' + i, 'alegre') })), { cls: 'avatars', cols: 3, cancel: false, title: 'ELIGE TU AVATAR' });
  const names = ['Alex', 'Sam', 'Ari', 'Noa', 'Dani', 'Cris', 'Otro…'], ni = await choose(names.map(t => ({ t })), { cls: 'avatars names', cols: 4, cancel: false, title: '¿Y CÓMO TE LLAMAS?' });
  let name = names[ni];
  if (ni === 6) { try { name = (window.prompt('Tu nombre (hasta 10 letras):', '') || '').trim().slice(0, 10); } catch (e) { name = ''; } if (!name) name = 'Alex'; }
  S.name = name;
  await lines(['sofia:alegre:¡{name}! Buen nombre para alguien que va a preguntarse por el ser.', 'sofia:picaro:Te espero en Villa Umbral. ¡No tardes!']);
  S.on = true;
  await fade(1);
  bg.remove();
  start();
}
async function title() {
  mode = 'title'; AU.play('title'); legend('menu');
  const t = el('div', 'title', '<div class="logo">METAFÍSICA<b>ADVANCE</b></div><div class="sub">Los ocho sellos del ser · un juego de dar y pedir razones</div>' +
    '<div class="cast">' + porImg('platon', 'pensar') + porImg('sofia', 'alegre') + porImg('ousia', 'alegre') + porImg('guille', 'picaro') + porImg('carnap', 'neutral') + '</div>');
  ui.appendChild(t);
  for (;;) {
    const its = S.on ? [{ t: 'CONTINUAR', s: S.name + ' · ' + Object.keys(S.badges).length + ' sellos' }, { t: 'NUEVA PARTIDA' }] : [{ t: 'NUEVA PARTIDA' }];
    const i = await choose(its, { cls: 'titlem', cancel: false });
    if (S.on && i === 0) { await fade(1); t.remove(); start(); return; }
    if (S.on) { const c = await choose([{ t: 'No, conservar mi partida' }, { t: 'Sí, empezar de nuevo' }], { cls: 'titlem', title: '¿Borrar la partida guardada?' }); if (c !== 1) continue; }
    t.remove();
    await newGame();
    return;
  }
}

/* ---------- botones, teclado y arranque ---------- */
document.querySelectorAll('.pad [data-pad]').forEach(b => {
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.classList.add('pressed'); down(b.dataset.pad); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => { b.classList.remove('pressed'); up(b.dataset.pad); }));
});
const KEYS = { arrowup: 'up', arrowdown: 'down', arrowleft: 'left', arrowright: 'right', z: 'A', enter: 'A', ' ': 'A', x: 'B', escape: 'B', a: 'L', s: 'R', p: 'start', backspace: 'select', h: 'select' };
function toggleMute() { if (S.mv > 0 || S.sv > 0) { S.mv = 0; S.sv = 0; } else { S.mv = 0.1; S.sv = 0.7; } applyVol(); save(); }
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'm') { AU.unlock(); toggleMute(); return; }
  const b = KEYS[k];
  if (!b) return;
  e.preventDefault();
  if (e.repeat && (!DIRS.includes(b) || !hstack.length)) return;
  down(b);
  const pb = document.querySelector('.pad [data-pad="' + b + '"]');
  if (pb) pb.classList.add('pressed');
});
document.addEventListener('keyup', e => {
  const b = KEYS[e.key.toLowerCase()];
  if (!b) return;
  up(b);
  const pb = document.querySelector('.pad [data-pad="' + b + '"]');
  if (pb) pb.classList.remove('pressed');
});
window.addEventListener('blur', () => { held.length = 0; runHeld = false; });
stage.addEventListener('click', () => { AU.unlock(); if (hstack.length) press('A'); else if (mode === 'world' && !busy) press('A'); });
if (mbtn) mbtn.addEventListener('click', () => { AU.unlock(); toggleMute(); });
document.addEventListener('contextmenu', e => { if (e.target.closest('.gba')) e.preventDefault(); });
let fitT = null;
window.addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(fit, 80); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
try {
  const link = document.createElement('link'), c = G.cv(48, 48);
  G.drawPortrait(c, 'ousia', CH.ousia.p, 'alegre');
  link.rel = 'icon'; link.href = c.toDataURL(); document.head.appendChild(link);
} catch (e) { /* sin icono */ }

function frame(now) {
  if (M && mode === 'world') { update(now); draw(now); }
  else if (M) update(now);
  requestAnimationFrame(frame);
}
fit(); applyVol();
fctx.fillStyle = DARK;
requestAnimationFrame(frame);
window.MA = {
  press, down, up, run, give, battle, wild, enter, quiz, menu, ontodex, sistema, cardHtml, level, maxHp, system, LOG,
  save: () => S, state: () => ({ mode, busy, map: M && M.id, x: P.x, y: P.y, dir: P.dir, h: hstack.length, mv: !!P.mv }),
  warp: (id, x, y) => { enter(id, { x, y }); }
};
title();
})();

</script>
