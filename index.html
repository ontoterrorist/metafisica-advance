:root {
  --desk: #12102a; --shell: #7a3fa0; --shell-hi: #9a5cc4; --shell-lo: #4f2672; --shell-ink: #f0deff; --bezel: #0e0d1f;
  --key: #2b2850; --key-lo: #15132e; --key-ink: #c3bdf5;
  --panel: #fff4d6; --panel-lo: #e8cf9a; --cream: #fff4d6;
  --ink: #2a1f4d; --ink2: #66598a; --line: #1d1438;
  --pri: #e03a2f; --pri-lo: #a2231c; --hi: #ffcf2e; --hi-lo: #d99a00;
  --ok: #178a3e; --bad: #c92a26;
  --fd: 'Press Start 2P', 'Courier New', monospace;
  --fb: 'VT323', 'Courier New', monospace;
  --fs: 'Jersey 20', 'Trebuchet MS', 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; height: 100%; display: flex; align-items: center; justify-content: center;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  overscroll-behavior: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  background: var(--desk); color: var(--shell-ink);
  font-family: var(--fb); font-size: 22px; line-height: 1.15; overflow: hidden;
}
button { font: inherit; color: inherit; }
p { margin: 0; }
i { font-style: normal; }
:focus-visible { outline: 3px solid var(--hi); outline-offset: 3px; }

/* ---------- consola ---------- */
.gba {
  width: 100%; max-width: 1380px; height: 100%; max-height: 880px;
  display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 4px;
  padding: 16px 6px 22px 18px; background: var(--shell);
  border-radius: 30px 30px 54px 30px;
  box-shadow: inset 0 5px 0 0 var(--shell-hi), inset 0 -9px 0 0 var(--shell-lo), inset -5px 0 0 0 var(--shell-lo), 0 12px 0 0 rgba(0, 0, 0, .4);
}
.bezel { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 26px 14px 14px; background: var(--bezel); border-radius: 14px 14px 26px 14px; box-shadow: 0 3px 0 0 var(--shell-hi); }
.btop { position: absolute; top: 7px; left: 18px; right: 18px; display: flex; align-items: center; gap: 10px; color: var(--shell-ink); }
.led { width: 9px; height: 9px; border-radius: 50%; background: var(--pri); box-shadow: 0 0 6px 1px var(--pri); }
.brand { font-family: var(--fs); font-size: 15px; letter-spacing: .16em; line-height: 1; }
.brand b { font-weight: 400; color: var(--hi); }
.snd { margin-left: auto; border: 0; background: none; padding: 2px 6px; font-family: var(--fd); font-size: 10px; color: var(--shell-ink); cursor: pointer; }
.snd.off { opacity: .4; text-decoration: line-through; }
.screen { flex: 1; min-width: 0; min-height: 0; overflow: hidden; position: relative; border-radius: 3px; display: flex; align-items: center; justify-content: center; background: #000; }

.pad { display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 8px; padding: 0 8px 4px; color: var(--shell-ink); min-height: 0; }
.pad button { border: 0; padding: 0; cursor: pointer; background: var(--key); color: var(--key-ink); font-family: var(--fd); -webkit-tap-highlight-color: transparent; touch-action: none; }
.pad button:active, .pad button.pressed { transform: translateY(3px); box-shadow: none; }
.shoulders { display: flex; gap: 12px; }
.sh { width: 86px; height: 34px; border-radius: 12px 12px 6px 6px; font-size: 11px; box-shadow: 0 4px 0 0 var(--key-lo); }
.dpad { position: relative; width: 132px; height: 132px; flex: none; filter: drop-shadow(0 4px 0 var(--key-lo)); }
.dpad::before { content: ''; position: absolute; left: 44px; top: 44px; width: 44px; height: 44px; background: var(--key); }
.dpad::after { content: ''; position: absolute; left: 58px; top: 58px; width: 16px; height: 16px; border-radius: 50%; background: var(--key-lo); opacity: .55; pointer-events: none; }
.dpad button { position: absolute; width: 44px; height: 44px; }
.dpad .up { left: 44px; top: 0; border-radius: 9px 9px 0 0; }
.dpad .down { left: 44px; top: 88px; border-radius: 0 0 9px 9px; }
.dpad .left { left: 0; top: 44px; border-radius: 9px 0 0 9px; }
.dpad .right { left: 88px; top: 44px; border-radius: 0 9px 9px 0; }
.dpad button::after { content: ''; position: absolute; left: 50%; top: 50%; border: 7px solid transparent; }
.dpad .up::after { border-bottom-color: var(--key-ink); transform: translate(-50%, -80%); }
.dpad .down::after { border-top-color: var(--key-ink); transform: translate(-50%, -20%); }
.dpad .left::after { border-right-color: var(--key-ink); transform: translate(-80%, -50%); }
.dpad .right::after { border-left-color: var(--key-ink); transform: translate(-20%, -50%); }
.dpad button:active, .dpad button.pressed { transform: none; filter: brightness(.7); }
.ab { position: relative; width: 156px; height: 104px; flex: none; }
.rb { position: absolute; width: 62px; height: 62px; border-radius: 50%; font-size: 15px; box-shadow: 0 5px 0 0 var(--key-lo); }
.pad .rb.a { right: 4px; top: 0; background: var(--pri); color: #fff6e0; box-shadow: 0 5px 0 0 var(--pri-lo); }
.rb.b { left: 4px; bottom: 0; }
.ss { display: flex; gap: 18px; font-family: var(--fd); font-size: 7px; letter-spacing: .08em; }
.ss span { display: flex; flex-direction: column; align-items: center; gap: 7px; }
.ss button { width: 54px; height: 16px; border-radius: 8px; box-shadow: 0 3px 0 0 var(--key-lo); }
.legend { min-height: 5.2em; font-size: 17px; line-height: 1.15; text-align: center; text-wrap: balance; }
.legend b { font-family: var(--fs); font-weight: 400; letter-spacing: .04em; color: var(--hi); }
.speaker { width: 96px; height: 40px; flex: none; background-image: radial-gradient(circle, var(--shell-lo) 3px, transparent 3.5px); background-size: 16px 13px; }

/* ---------- escenario ---------- */
.stage { position: relative; width: 30em; height: 20em; flex: none; overflow: hidden; background: var(--bezel); color: var(--ink); font-family: var(--fb); font-size: 20px; line-height: 1.1; }
.stage canvas, .stage img { image-rendering: pixelated; image-rendering: crisp-edges; }
.stage canvas, .stage img { image-rendering: pixelated; }
#cv, #fxc { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
#ui { position: absolute; inset: 0; z-index: 2; }
#fxc { z-index: 50; pointer-events: none; }
#top { position: absolute; inset: 0; z-index: 60; pointer-events: none; overflow: hidden; }
.stage b, .stage strong, .stage h3, .stage h4 { font-family: var(--fs); font-weight: 400; letter-spacing: .02em; }
.dim { color: var(--ink2); }
.pn, .dlg, .bmsg, .menu, .bx, .got { background: var(--panel); box-shadow: 0 0 0 .13em var(--line), inset 0 -.14em 0 0 var(--panel-lo), .2em .28em 0 0 rgba(0, 0, 0, .28); border-radius: .22em; }
@keyframes blink { 50% { opacity: .15; } }

.hud { position: absolute; left: .4em; right: .4em; top: .35em; display: flex; justify-content: space-between; pointer-events: none; font-family: var(--fs); font-size: .78em; line-height: 1; }
.hud span { padding: .2em .5em .22em; background: rgba(29, 20, 56, .78); color: var(--cream); border-radius: .2em; letter-spacing: .05em; }
.banner { position: absolute; left: 50%; top: 2.1em; padding: .15em .9em .2em; background: var(--hi); color: var(--line); font-family: var(--fs); font-size: 1.25em; letter-spacing: .08em; white-space: nowrap; box-shadow: 0 0 0 .1em var(--line), .15em .2em 0 0 rgba(0, 0, 0, .35); animation: banner 2.6s steps(20) both; }
@keyframes banner { 0% { transform: translate(-50%, -4em); } 10%, 85% { transform: translate(-50%, 0); } 100% { transform: translate(-50%, -4em); } }

/* diálogo */
.dlg, .bmsg { position: absolute; left: .5em; right: .5em; bottom: .5em; height: 4.75em; padding: .5em .8em; z-index: 30; }
.dlg .tx, .bmsg .tx { height: 3.3em; overflow: hidden; font-size: 1em; line-height: 1.1; }
.dlg .tx b, .bmsg .tx b { color: #7a1fa8; }
.nx { position: absolute; right: .7em; bottom: .25em; font-size: .7em; color: var(--pri); animation: blink .9s steps(1) infinite; }
.dlg .por { position: absolute; left: .3em; bottom: calc(100% + .08em); width: 7em; height: 7em; filter: drop-shadow(.14em .2em 0 rgba(0, 0, 0, .3)); animation: bob 1.6s steps(2) infinite; }
.dlg .nm { position: absolute; left: 7.6em; bottom: calc(100% + .3em); padding: .08em .6em .12em; background: var(--hi); color: var(--line); font-size: .95em; letter-spacing: .06em; box-shadow: 0 0 0 .12em var(--line); border-radius: .15em; }
.dlg.nar .por, .dlg.nar .nm { display: none; }
@keyframes bob { 50% { transform: translateY(-2%); } }
.black { position: absolute; inset: 0; z-index: 1; background: radial-gradient(circle at 50% 38%, #3a2f7a, #12102a 70%); }

/* menús */
.menu { position: absolute; z-index: 20; display: flex; flex-direction: column; padding: .3em; min-height: 0; }
.menu .mt { flex: none; padding: .05em .4em .2em; margin-bottom: .15em; font-family: var(--fs); font-size: .86em; line-height: 1.05; letter-spacing: .05em; color: var(--ink2); border-bottom: .1em dashed var(--panel-lo); }
.menu .ml { position: relative; flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: none; }
.menu .ml::-webkit-scrollbar, .menu .md::-webkit-scrollbar { display: none; }
.opt { display: flex; align-items: center; gap: .4em; padding: .12em .45em .14em; min-height: 1.35em; font-family: var(--fs); font-size: .95em; line-height: 1.02; border-radius: .16em; cursor: pointer; }
.opt span { min-width: 0; flex: 1; }
.opt small { display: block; font-family: var(--fb); font-size: .86em; line-height: 1; color: var(--ink2); }
.opt.sel { background: var(--hi); box-shadow: 0 0 0 .1em var(--line); }
.opt.dis { opacity: .45; }
.opt .tag { flex: none; padding: .5em .55em .4em; font-family: var(--fd); font-size: .34em; line-height: 1; background: var(--ink); color: var(--panel); white-space: nowrap; border-radius: .3em; }
.tag.dec { background: var(--ok); } .tag.per { background: #a86a00; } .tag.graze, .tag.unk { background: #8b90b8; } .tag.self { background: var(--bad); } .tag.fx { background: #7a1fa8; }
.tag.tT { background: #c98a00; } .tag.tA { background: var(--bad); } .tag.tC { background: #2a7fb8; }
img.idea { flex: none; width: 1.45em; height: 1.45em; }
.noidea { flex: none; width: 1.45em; height: 1.45em; border-radius: 50%; background: var(--panel-lo); }
.menu .md { min-height: 0; overflow-y: auto; scrollbar-width: none; padding: .1em .3em .2em .6em; border-left: .1em dashed var(--panel-lo); font-size: .9em; line-height: 1.08; }
.menu.side { right: .5em; top: .5em; width: 12.5em; max-height: 13em; }
.menu.grid { right: .5em; bottom: .5em; width: 15em; height: 4.75em; z-index: 31; }
.menu.grid .ml { display: grid; grid-template-columns: 1fr 1fr; align-content: center; gap: .1em .2em; }
.menu.detail, .menu.page { display: grid; grid-template-columns: 12em minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); z-index: 32; }
.menu.detail { left: .5em; right: .5em; bottom: .5em; height: 11.6em; }
.menu.page { inset: .5em; z-index: 22; }
.menu.detail .mt, .menu.page .mt { grid-column: 1 / 3; }
.menu.full { left: .5em; right: .5em; bottom: .5em; max-height: 13em; z-index: 32; }
.menu.full .mt { font-family: var(--fb); font-size: 1em; color: var(--ink); letter-spacing: 0; padding-bottom: .3em; }
.menu.full .mt b { color: #7a1fa8; }
.menu.full .opt { font-family: var(--fb); font-size: 1em; padding: .22em .5em; margin-top: .1em; background: #fffaf0; box-shadow: 0 0 0 .08em var(--panel-lo); }
.menu.full .opt.sel { background: var(--hi); box-shadow: 0 0 0 .1em var(--line); }
.menu.titlem { left: 50%; bottom: 1em; width: 14em; transform: translateX(-50%); }
.menu.titlem .opt { justify-content: center; text-align: center; font-size: 1.1em; }
.menu.avatars { left: 50%; top: .6em; width: 21em; transform: translateX(-50%); }
.menu.avatars .ml { display: grid; grid-template-columns: repeat(3, 1fr); gap: .2em; }
.menu.avatars .opt { justify-content: center; padding: .15em; }
.menu.avatars .pimg { width: 5.3em; height: 5.3em; }
.menu.names { top: 4.5em; width: 22em; }
.menu.names .ml { grid-template-columns: repeat(4, 1fr); }
.menu.names .opt { text-align: center; font-size: 1.1em; padding: .3em; }

/* fichas de carta */
.cd h3 { margin: 0; font-size: 1.2em; line-height: 1; }
.cd h4 { margin: .4em 0 .1em; font-size: .8em; letter-spacing: .08em; color: #7a1fa8; }
.cd small { color: var(--ink2); }
.cd p { margin: .2em 0 0; }
.cd ul { margin: .1em 0 0; padding-left: 1em; }
.cd ul.no { list-style: '✕ '; color: #8a2020; }
.cd ul.sys { list-style: none; padding: 0; }
.cd ul.sys li { margin-top: .2em; padding-left: 1.1em; position: relative; }
.cd ul.sys li::before { position: absolute; left: 0; font-family: var(--fs); }
.cd ul.sys li.ok::before { content: '✚'; color: var(--ok); }
.cd ul.sys li.bad::before { content: '✖'; color: var(--bad); }
.cd ul.sys li.bad b { color: var(--bad); } .cd ul.sys li.ok b { color: var(--ok); }
.chd { display: flex; align-items: center; gap: .5em; }
.chd img.idea { width: 2.6em; height: 2.6em; }
.chip { display: inline-block; padding: .35em .5em .3em; font-family: var(--fd); font-size: .36em; line-height: 1.2; color: var(--panel); background: var(--ink); border-radius: .3em; }
.chip.tT { background: #c98a00; } .chip.tA { background: var(--bad); } .chip.tC { background: #2a7fb8; }
.cd.score { display: grid; grid-template-columns: 1fr 1fr; gap: .6em; }
.cd.score h4 { margin-top: 0; }
.got { position: absolute; left: 50%; top: 4.2em; z-index: 40; display: flex; align-items: center; gap: .7em; padding: .5em 1em .6em .7em; transform: translateX(-50%); white-space: nowrap; animation: pop .3s steps(4); }
.got img.idea { width: 3.6em; height: 3.6em; animation: bob .8s steps(2) infinite; }
.got small { display: block; font-family: var(--fd); font-size: .36em; color: #7a1fa8; margin-bottom: .6em; }
.got b { display: block; font-size: 1.3em; line-height: 1; }
.got span { color: var(--ink2); font-size: .9em; }
@keyframes pop { 0% { transform: translateX(-50%) scale(.4); } 70% { transform: translateX(-50%) scale(1.12); } }

/* ---------- disputa ---------- */
.battle { position: absolute; inset: 0; z-index: 5; overflow: hidden; --kc: #e2a13a; }
.battle .sky { position: absolute; inset: 0; background:
  repeating-linear-gradient(0deg, rgba(255, 255, 255, .22) 0 .22em, transparent .22em .66em),
  linear-gradient(color-mix(in srgb, var(--kc) 55%, #fff) 0%, color-mix(in srgb, var(--kc) 18%, #fff4d6) 62%, color-mix(in srgb, var(--kc) 40%, #fff4d6) 100%); }
.plat { position: absolute; border-radius: 50%; background: color-mix(in srgb, var(--kc) 62%, #fff); box-shadow: 0 0 0 .13em var(--line), inset 0 -.4em 0 0 rgba(0, 0, 0, .16), inset 0 .25em 0 0 rgba(255, 255, 255, .35); }
.pf { right: .8em; top: 6.3em; width: 13em; height: 2.7em; }
.pm { left: .3em; bottom: 4.9em; width: 16em; height: 3.2em; }
.fig { position: absolute; }
.fig canvas, .fig img { display: block; width: 100%; height: auto; }
.foe { right: 3.2em; top: -.4em; width: 8.4em; animation: in-r .5s steps(8) both; }
.me { left: 1.6em; bottom: 6.3em; width: 8.4em; animation: in-l .5s steps(8) both; }
.ou { left: 10.2em; bottom: 6.5em; width: 4.4em; animation: in-l .7s steps(8) both, bob 1.2s .7s steps(2) infinite; }
.wild .foe { right: 4.6em; top: 1.3em; width: 6em; }
.wild .fbox .bar { display: none; }
.wild .foe img { width: 100%; height: auto; animation: hop .7s steps(3) infinite; }
.foe.caught img { animation: caught .6s steps(6) forwards; }
.foe.fled img { animation: fled .5s steps(6) forwards; }
@keyframes hop { 50% { transform: translateY(-12%); } }
@keyframes caught { to { transform: scale(.1) rotate(360deg); opacity: 0; } }
@keyframes fled { to { transform: translateX(160%); opacity: 0; } }
@keyframes in-r { from { transform: translateX(-22em); } }
@keyframes in-l { from { transform: translateX(22em); } }
.fig.hit { animation: hit .42s steps(6); }
@keyframes hit { 0%, 40%, 80% { transform: translateX(-.35em); filter: brightness(2.2) saturate(.3); } 20%, 60%, 100% { transform: translateX(.35em); filter: none; } }
.bx { position: absolute; width: 14.5em; padding: .22em .55em .4em; }
.fbox { left: .6em; top: .7em; }
.mbox { right: .6em; bottom: 5.85em; }
.bx .r1 { display: flex; align-items: baseline; justify-content: space-between; gap: .4em; }
.bx .r1 b { font-size: 1.02em; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bx .r1 i { flex: none; font-family: var(--fs); font-size: .8em; color: var(--pri); }
.bx .th { font-size: .86em; line-height: 1; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: .45em; margin: .2em 0 .05em; background: #3a3566; box-shadow: 0 0 0 .1em var(--line); border-radius: .2em; overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: #3ec46a; transition: width .5s steps(10); }
.bar i.mid { background: var(--hi); } .bar i.low { background: var(--pri); }
.bx .hp { text-align: right; font-family: var(--fs); font-size: .8em; line-height: 1; }
.shot { position: absolute; z-index: 6; width: 2.8em; }
.shot img { width: 100%; height: auto; display: block; }
.shot.to-foe { animation: tofoe .43s steps(9) both; }
.shot.to-me { animation: tome .43s steps(9) both; }
@keyframes tofoe { from { left: 8em; bottom: 10em; transform: scale(.6); } to { left: 21em; bottom: 14em; transform: scale(1.3) rotate(360deg); } }
@keyframes tome { from { left: 21em; bottom: 14em; transform: scale(.6); } to { left: 5em; bottom: 9em; transform: scale(1.3) rotate(-360deg); } }
.vs { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 1em; background: linear-gradient(100deg, #33479e 0 49%, #1d1438 49% 51%, #b0362f 51% 100%); color: var(--cream); }
.vs > div { display: flex; flex-direction: column; align-items: center; width: 11em; text-align: center; }
.vs .pimg { width: 8em; height: 8em; filter: drop-shadow(.2em .25em 0 rgba(0, 0, 0, .4)); }
.vs b { font-size: 1.4em; line-height: 1; letter-spacing: .05em; text-shadow: .1em .1em 0 var(--line); }
.vs small { font-size: .9em; }
.vs i { font-family: var(--fd); font-size: 1.6em; color: var(--hi); text-shadow: .12em .12em 0 var(--line); animation: pop2 .5s steps(5) both; }
.vs .va { animation: in-r .45s steps(8) both; } .vs .vb { animation: in-l .45s steps(8) both; }
@keyframes pop2 { 0% { transform: scale(3); opacity: 0; } }

/* ---------- portada ---------- */
.title { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; padding-top: 1.1em; color: var(--cream); text-align: center;
  background-color: #33479e; background-image: linear-gradient(45deg, #2c3e8c 25%, transparent 25%, transparent 75%, #2c3e8c 75%), linear-gradient(45deg, #2c3e8c 25%, transparent 25%, transparent 75%, #2c3e8c 75%);
  background-size: 2em 2em; background-position: 0 0, 1em 1em; }
.logo { font-family: var(--fs); font-size: 3.4em; line-height: .86; letter-spacing: .06em; text-shadow: .06em .06em 0 var(--line), -.03em -.03em 0 var(--line), .03em -.03em 0 var(--line), -.03em .03em 0 var(--line); }
.logo b { display: block; font-size: .62em; letter-spacing: .34em; color: var(--hi); }
.sub { margin-top: .45em; padding: .1em .8em .16em; background: var(--line); font-family: var(--fs); font-size: .9em; letter-spacing: .08em; border-radius: .2em; }
.cast { display: flex; align-items: flex-end; justify-content: center; gap: .1em; margin-top: .5em; }
.cast .pimg { width: 5em; height: 5em; filter: drop-shadow(.12em .18em 0 rgba(0, 0, 0, .35)); animation: bob 1.4s steps(2) infinite; }
.cast .pimg:nth-child(2n) { animation-delay: .7s; }
.cast .pimg:nth-child(2), .cast .pimg:nth-child(3) { width: 6em; height: 6em; }

/* ---------- escenario vertical (20 × 30 em): celular de pie, con la letra más grande ---------- */
.stage.tall { width: 20em; height: 30em; }
.tall .dlg, .tall .bmsg { height: 5.85em; padding: .5em .7em; }
.tall .dlg .tx, .tall .bmsg .tx { height: 4.4em; }
.tall .dlg .por { width: 6.4em; height: 6.4em; }
.tall .dlg .nm { left: 6.8em; max-width: 12.4em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tall .banner { font-size: 1.1em; }
.tall .got { white-space: normal; width: 18em; }

/* ---------- personajes del mapa (16×20, tres cuadros por dirección) ---------- */

  B.e(8, 5.5, 5, 4.6, sk);
  if (up) {

    if (big) B.r(3, 5, 10, 7, hr);

    if (hs === 'bald') B.r(9, 5, 4, 3, hr); else { B.e(8, 3.2, 5.3, 3, hr); B.r(8, 2, 5, 6, hr); }

}
const scache = {};

  if (scache[key]) return scache[key];

let osheet = null;

/* ---------- retratos (48×48) con emociones ---------- */
const EMOS = {
  neutral: { e: 'o', b: 'f', m: 's' }, alegre: { e: 'h', b: 'u', m: 'D' }, pensar: { e: 'l', b: 'q', m: 'f' }, sorpresa: { e: 'w', b: 'u', m: 'o' },
  enojo: { e: 'n', b: 'a', m: 'g' }, triste: { e: 'd', b: 's', m: 'r' }, picaro: { e: 'k', b: 'q', m: 'k' }, duda: { e: 'o', b: 's', m: 'z' }

function face(B, cx, cy, emo, o) {
  const E = EMOS[emo] || EMOS.neutral, dx = o.dx || 5, ey = cy + 1, by = cy - 4, my = cy + 9, W = '#ffffff', K = INK, big = o.big ? 1 : 0;
  const brow = o.brow || K, lid = o.lid || K;
  [-1, 1].forEach(s => {
    const x = Math.round(cx + s * dx) - 2;
    let e = E.e;
    if (e === 'k') e = s > 0 ? 'c' : 'o';
    if (e === 'o') B.r(x, ey, 4, 3 + big, W).r(x + 1, ey, 2, 3 + big, K).p(x + 1, ey, W);
    else if (e === 'h') B.p(x, ey + 2, K).p(x + 1, ey + 1, K).p(x + 2, ey + 1, K).p(x + 3, ey + 2, K);
    else if (e === 'l') B.r(x, ey, 4, 3 + big, W).r(x, ey, 2, 2, K);
    else if (e === 'w') B.r(x, ey - 1, 4, 5 + big, W).r(x + 1, ey + 1, 2, 2, K);
    else if (e === 'n') B.r(x, ey + 1, 4, 2, W).r(x + 1, ey + 1, 2, 2, K).r(x, ey, 4, 1, lid);
    else if (e === 'd') B.r(x, ey + 1, 4, 2 + big, W).r(x + 1, ey + 2, 2, 1 + big, K).r(x, ey, 4, 1, lid);
    else if (e === 'c') B.r(x, ey + 1, 4, 1, K);
    for (let i = 0; i < 4; i++) {
      const inner = s < 0 ? i : 3 - i;   // 0 = extremo exterior, 3 = junto a la nariz
      let yy = by;
      if (E.b === 'u') yy = by - 2;
      else if (E.b === 'a') yy = by - 2 + Math.round(inner * .8);
      else if (E.b === 's') yy = by - Math.round(inner * .7);
      else if (E.b === 'q') yy = s > 0 ? by - 2 : by;
      B.p(x + i, yy, brow);
    }
  });
  if (!o.nonose) B.p(cx, cy + 5, o.skD).p(cx + 1, cy + 5, o.skD).p(cx + 1, cy + 4, o.skD);
  const R = '#8a2233';
  switch (E.m) {
    case 's': B.r(cx - 3, my, 6, 1, K).p(cx - 4, my - 1, K).p(cx + 3, my - 1, K); break;
    case 'D': B.r(cx - 4, my - 1, 8, 1, K).r(cx - 3, my, 6, 3, R).r(cx - 3, my, 6, 1, W).r(cx - 2, my + 3, 4, 1, K).p(cx - 4, my, K).p(cx + 3, my, K).r(cx - 1, my + 2, 2, 1, '#ff7a8a'); break;
    case 'f': B.r(cx - 2, my, 5, 1, K); break;
    case 'o': B.r(cx - 1, my - 1, 3, 4, K).r(cx, my, 1, 2, R); break;
    case 'g': B.r(cx - 4, my - 1, 8, 3, K).r(cx - 3, my, 6, 1, W).p(cx - 1, my, K).p(cx + 1, my, K); break;
    case 'r': B.r(cx - 3, my, 6, 1, K).p(cx - 4, my + 1, K).p(cx + 3, my + 1, K); break;
    case 'k': B.r(cx - 2, my, 5, 1, K).p(cx + 3, my - 1, K).p(cx + 4, my - 2, K); break;
    case 'z': for (let i = -3; i <= 3; i++) B.p(cx + i, my + (i & 1 ? 1 : 0), K); break;
  }

  if (emo === 'triste') B.r(cx - dx - 1, ey + 4 + big, 1, 3, '#6ec9ff').p(cx - dx - 1, ey + 7 + big, '#c9ecff');

/* signos alrededor de la cabeza: se dibujan antes del contorno */

  accidental: { t: 'A', p: 'caus', n: 'Regularidad accidental', d: 'Todas las monedas de mi bolsillo son de cobre, y al canto del gallo le sigue siempre el amanecer. Hay sucesión constante y, sin embargo, ninguna causalidad.',
    vs: { regularidad: 2 }, pro: ['contrafactica', 'poderes'], rep: ['ley'] },
  causacomun: { t: 'A', p: 'caus', n: 'Causa común', d: 'Siempre que cae el barómetro, hay tormenta. Pero el barómetro no causa la tormenta: ambos son efectos de la baja presión. La regularidad no distingue causas de síntomas.',
    vs: { regularidad: 2 }, pro: ['poderes', 'contrafactica'], rep: [] },
  preempcion: { t: 'A', p: 'caus', n: 'Causa de reserva', d: 'Ana lanza una piedra y rompe la ventana. Beto estaba listo para lanzar la suya si Ana fallaba. Sin el tiro de Ana, la ventana se habría roto igual… y, aun así, Ana la rompió.',
    vs: { contrafactica: 2 }, pro: ['poderes', 'regularidad'], rep: ['cadena'] },
  sobredet: { t: 'A', p: 'caus', n: 'Sobredeterminación', d: 'Dos balas alcanzan el corazón al mismo tiempo. Sin cualquiera de ellas, la muerte habría ocurrido igual: según el análisis contrafáctico, ninguna la causó.',
    vs: { contrafactica: 2 }, pro: ['poderes', 'regularidad'], rep: [] },
  omision: { t: 'A', p: 'caus', n: 'Causar por omisión', d: 'El jardinero no regó y la planta murió. La falta de riego causó la muerte. Pero una ausencia no es una cosa: ¿qué poder ejerce lo que no existe?',
    vs: { poderes: 2 }, pro: ['contrafactica'], rep: [] },
  dormitiva: { t: 'A', p: 'caus', n: 'Virtud dormitiva', by: 'Molière', d: '¿Por qué el opio hace dormir? «Porque tiene una virtud dormitiva.» Postular un poder para cada efecto no explica nada: solo le pone nombre a lo que había que explicar.',
    vs: { poderes: 1 }, pro: ['regularidad'], rep: ['disposicion'] },
  conexion: { t: 'C', p: 'caus', n: 'Conexión necesaria', fx: 'prec', d: 'El supuesto lazo por el que, dada la causa, el efecto *tiene que* ocurrir. Hume negó que tengamos experiencia de él.' },
  ley: { t: 'C', p: 'caus', n: 'Ley de la naturaleza', by: 'Mill · Ramsey · Lewis', fx: 'dist', d: 'No toda regularidad cuenta: solo las que forman parte del mejor sistema de leyes, el más simple e informativo. Las coincidencias quedan fuera.' },
  cadena: { t: 'C', p: 'caus', n: 'Cadena causal', by: 'David Lewis', fx: 'dist', d: 'Causar no exige dependencia directa: basta una cadena de sucesos en que cada eslabón dependa del anterior. La piedra de Ana completa su cadena; la de Beto, no.' },
  disposicion: { t: 'C', p: 'caus', n: 'Disposición', fx: 'dist', d: 'Un poder se identifica por lo que haría en ciertas circunstancias: la sal se disolvería en agua. Se conoce por sus manifestaciones y permite predecir casos nuevos.' },

  /* ---------- tiempo ---------- */
  presentismo: { t: 'T', p: 'tiempo', n: 'Presentismo', by: 'Prior · Bigelow', w: -1, d: 'Solo existe lo presente. Los dinosaurios no existen (existieron) y las colonias en Marte no existen (quizá existirán). El paso del tiempo es real.',
    cl: ['Solo existe lo presente.', 'El paso del tiempo es un rasgo real del mundo.', 'Sócrates no existe: existió.'], inc: ['Los dinosaurios existen, solo que lejos en el tiempo.', '«Ahora» no señala ningún momento especial.'] },
  eternalismo: { t: 'T', p: 'tiempo', n: 'Eternalismo', by: 'Russell · Mellor', w: 1, d: 'Pasado, presente y futuro existen por igual, como los lugares de un mapa: es el universo bloque. «Ahora» funciona como «aquí»: depende de quién lo dice.',
    cl: ['Pasado, presente y futuro existen por igual.', '«Ahora» es como «aquí»: no señala un momento privilegiado.', 'Los sucesos se ordenan por antes y después, y nada más.'], inc: ['El futuro todavía no existe.', 'El presente es metafísicamente especial.'] },
  bloque: { t: 'T', p: 'tiempo', n: 'Bloque creciente', by: 'C. D. Broad · Tooley', w: 0, d: 'Existen el pasado y el presente, pero no el futuro. La realidad crece: cada instante añade una nueva capa de ser, y el presente es su borde.',
    cl: ['El pasado y el presente existen; el futuro no.', 'La realidad crece con el paso del tiempo.', 'El presente es el borde del ser.'], inc: ['Solo existe lo presente.', 'Los sucesos futuros ya existen.'] },
  irrealidad: { t: 'T', p: 'tiempo', n: 'Irrealidad del tiempo', by: 'J. M. E. McTaggart', w: -1, d: 'El tiempo exige cambio, y el cambio exige que los sucesos pasen de futuros a presentes y a pasados. Pero esa idea es contradictoria. Luego el tiempo no es real.',
    cl: ['Sin la serie A no hay cambio, y sin cambio no hay tiempo.', 'La serie A es contradictoria.', 'El tiempo no es real.'], inc: ['El orden antes/después basta para que haya tiempo.', 'El paso del tiempo es un rasgo real del mundo.'] },
  mctaggart: { t: 'A', p: 'tiempo', n: 'Paradoja de McTaggart', by: 'J. M. E. McTaggart', d: 'Todo suceso es futuro, es presente y es pasado: tres rasgos incompatibles. Decir que los tiene «en momentos distintos» presupone el paso del tiempo que había que explicar.',
    vs: { presentismo: 2, bloque: 2 }, pro: ['eternalismo', 'irrealidad'], rep: ['tensado'] },
  relatividad: { t: 'A', p: 'tiempo', n: 'Simultaneidad relativa', by: 'Putnam · Rietdijk', d: 'Según la relatividad especial, qué sucesos son simultáneos depende del observador. No hay un «ahora» único para todo el universo, así que no puede haber un presente privilegiado.',
    vs: { presentismo: 2, bloque: 2 }, pro: ['eternalismo'], rep: [] },
  hacedores: { t: 'A', p: 'tiempo', n: 'Verdades sobre el pasado', d: '«César cruzó el Rubicón» es verdadera. Toda verdad necesita algo existente que la haga verdadera. Si el pasado no existe, nada hace verdadera esa oración.',
    vs: { presentismo: 2 }, pro: ['eternalismo', 'bloque'], rep: ['tensado'] },
  gracias: { t: 'A', p: 'tiempo', n: '¡Menos mal que ya pasó!', by: 'A. N. Prior', d: 'Al salir del dentista siento alivio porque el dolor *ya pasó*. Ese alivio no tiene sentido si solo es verdad que el dolor «es anterior a las 15:00»: lo que importa es que quedó atrás.',
    vs: { eternalismo: 2, irrealidad: 1 }, pro: ['presentismo', 'bloque'], rep: ['indexical'] },
  ritmo: { t: 'A', p: 'tiempo', n: '¿A qué velocidad pasa?', by: 'J. J. C. Smart', d: 'Si el tiempo fluye, fluye a alguna velocidad. ¿A un segundo por segundo? Eso no es una velocidad. Luego la idea de que el tiempo pasa no tiene sentido.',
    vs: { presentismo: 1, bloque: 1 }, pro: ['eternalismo', 'irrealidad'], rep: [] },
  abierto: { t: 'A', p: 'tiempo', n: 'Futuro abierto', by: 'Aristóteles', d: 'Si la batalla naval de mañana ya existe en el bloque, ya está decidido que ocurra. Pero el futuro parece abierto: todavía depende de lo que hagamos.',
    vs: { eternalismo: 1 }, pro: ['bloque', 'presentismo'], rep: [] },
  pasadovivo: { t: 'A', p: 'tiempo', n: '¿Estoy en el presente?', by: 'Bourne · Braddon-Mitchell', d: 'En el bloque creciente Sócrates sigue existiendo en el pasado, y allí cree estar en el presente. Si él se equivoca, ¿cómo sabes tú que no estás también en el pasado?',
    vs: { bloque: 2 }, pro: ['presentismo', 'eternalismo'], rep: [] },
  cambiob: { t: 'A', p: 'tiempo', n: 'Cambio sin serie A', by: 'Bertrand Russell', d: 'Cambiar es tener una propiedad en un momento y otra distinta después: el atizador está caliente el lunes y frío el martes. No hace falta que ningún suceso «se vuelva pasado».',
    vs: { irrealidad: 2, presentismo: 1 }, pro: ['eternalismo'], rep: [] },
  sincambiob: { t: 'A', p: 'tiempo', n: 'Una serie congelada', by: 'J. M. E. McTaggart', d: 'En la serie B, que la reina Ana muera antes de que yo nazca es verdad siempre y para siempre. Si nada deja de ser futuro para volverse presente, nada cambia; y sin cambio no hay tiempo.',
    vs: { eternalismo: 2 }, pro: ['irrealidad', 'presentismo'], rep: [] },
  seriesab: { t: 'C', p: 'tiempo', n: 'Series A y B', by: 'McTaggart', fx: 'prec', d: 'Serie A: los sucesos se ordenan como pasados, presentes o futuros, y eso va cambiando. Serie B: se ordenan como anteriores o posteriores, y eso no cambia nunca.' },
  hacedor: { t: 'C', p: 'tiempo', n: 'Hacedor de verdad', fx: 'prec', d: 'Toda verdad es verdadera en virtud de algo que existe: aquello que la hace verdadera. Una verdad sin hacedor flotaría en el vacío.' },
  tensado: { t: 'C', p: 'tiempo', n: 'Hecho tensado', by: 'A. N. Prior', fx: 'dist', d: 'Ningún suceso *es* pasado, presente y futuro a la vez: *fue* futuro, *es* presente, *será* pasado. Los tiempos verbales describen rasgos irreducibles de la realidad actual.' },
  indexical: { t: 'C', p: 'tiempo', n: 'Indexical', by: 'Perry · Mellor', fx: 'dist', d: 'Palabras como «yo», «aquí» y «ahora» cambian de referencia según quién las use. Una creencia con «ahora» puede ser indispensable para actuar sin describir un rasgo especial del mundo.' },

  /* ---------- persistencia ---------- */
  endurantismo: { t: 'T', p: 'pers', n: 'Endurantismo', by: 'Wiggins · van Inwagen', w: 0, d: 'Las cosas persisten estando enteras en cada momento. El gato de ayer y el de hoy son uno y el mismo: no una parte de ayer y otra parte de hoy.',
    cl: ['Una cosa está entera en cada momento en que existe.', 'El gato de ayer es numéricamente idéntico al de hoy.', 'Las cosas no tienen partes temporales.'], inc: ['Solo una parte de ti existe en este instante.', 'Nada sobrevive al cambio de una de sus partes.'] },
  perdurantismo: { t: 'T', p: 'pers', n: 'Perdurantismo', by: 'Quine · Lewis · Sider', w: 1, d: 'Las cosas se extienden en el tiempo como en el espacio: son «gusanos» de cuatro dimensiones hechos de partes temporales. Lo que ves ahora es solo una rebanada del gato.',
    cl: ['Las cosas tienen partes temporales.', 'Persistir es extenderse en el tiempo, como un camino se extiende en el espacio.', 'En cada instante solo está presente una parte de la cosa.'], inc: ['Estás entero en este instante.', 'Las cosas solo tienen partes espaciales.'] },
  esencialismo_mer: { t: 'T', p: 'pers', n: 'Esencialismo mereológico', by: 'Roderick Chisholm', w: -1, d: 'Una cosa tiene sus partes necesariamente: si pierde una sola, deja de existir y otra ocupa su lugar. En sentido estricto, nadie se baña dos veces en el mismo río.',
    cl: ['Si una cosa pierde una parte, deja de existir.', 'El barco reparado es, estrictamente, otro barco.', 'Decimos «el mismo» solo en sentido laxo.'], inc: ['Una cosa puede sobrevivir al reemplazo de todas sus partes.', 'Tu cuerpo de hoy es estrictamente idéntico al de hace diez años.'] },
  intrinsecos: { t: 'A', p: 'pers', n: 'Intrínsecos temporarios', by: 'David Lewis', d: 'Sentado tengo forma doblada; de pie, recta. Si soy uno y el mismo, entero en ambos momentos, una sola cosa tiene dos formas incompatibles. Eso es imposible.',
    vs: { endurantismo: 2 }, pro: ['perdurantismo'], rep: ['indexada'] },
  estatua: { t: 'A', p: 'pers', n: 'La estatua y la arcilla', d: 'La estatua y su trozo de arcilla ocupan el mismo lugar. Pero la arcilla sobreviviría a ser aplastada y la estatua no: por la Ley de Leibniz son dos cosas… en el mismo sitio y con los mismos átomos.',
    vs: { endurantismo: 2 }, pro: ['perdurantismo'], rep: ['constitucion'] },
  teseo: { t: 'A', p: 'pers', n: 'El barco de Teseo', by: 'Plutarco · Hobbes', d: 'Se cambian una a una todas las tablas del barco, y con las viejas se arma otro. El reparado conserva la continuidad; el rearmado, la materia. Los dos no pueden ser el barco original.',
    vs: { endurantismo: 1 }, pro: ['perdurantismo', 'esencialismo_mer'], rep: [] },
  variacion: { t: 'A', p: 'pers', n: 'Variación no es cambio', by: 'D. H. Mellor', d: 'Un camino angosto en un tramo y ancho en otro no cambia: solo varía de una parte a otra. Si persistir es tener partes temporales distintas, entonces nada cambia jamás.',
    vs: { perdurantismo: 2 }, pro: ['endurantismo'], rep: [] },
  tiza: { t: 'A', p: 'pers', n: 'Partes de la nada', by: 'Judith Jarvis Thomson', d: 'Sostengo una tiza. Según el perdurantista, a cada instante aparece de la nada una nueva parte temporal de tiza, completa y lista. Es una metafísica disparatada.',
    vs: { perdurantismo: 1 }, pro: ['endurantismo'], rep: [] },
  atomo: { t: 'A', p: 'pers', n: 'Un átomo menos', d: 'Acabas de perder un átomo al respirar. Si nada sobrevive a la pérdida de una parte, tú, tu gato y tu casa dejan de existir a cada instante. Nadie puede creer eso.',
    vs: { esencialismo_mer: 2 }, pro: ['endurantismo', 'perdurantismo'], rep: ['laxo'] },
  deuda: { t: 'A', p: 'pers', n: 'La deuda de ayer', by: 'Epicarmo', d: 'Si quien pidió el préstamo ayer ya no existe, hoy nadie lo debe. Prometer, castigar y agradecer exigen que la persona de ayer sea la de hoy.',
    vs: { esencialismo_mer: 2, perdurantismo: 1 }, pro: ['endurantismo'], rep: ['laxo'] },
  identidad: { t: 'C', p: 'pers', n: 'Identidad numérica', fx: 'prec', d: 'Ser una y la misma cosa, no dos cosas muy parecidas. Dos gotas de agua son cualitativamente idénticas; numéricamente son dos.' },
  leibniz: { t: 'C', p: 'pers', n: 'Ley de Leibniz', fx: 'prec', d: 'Si x e y son idénticos, todo lo que es verdad de x es verdad de y. Basta una sola diferencia para probar que son dos cosas.' },
  indexada: { t: 'C', p: 'pers', n: 'Propiedad indexada', fx: 'dist', d: 'No tengo «estar doblado» sin más, sino «estar doblado a las 10» y «estar recto a las 11». Esas dos propiedades son perfectamente compatibles.' },
  constitucion: { t: 'C', p: 'pers', n: 'Constitución', by: 'Wiggins · Baker', fx: 'dist', d: 'La arcilla *constituye* la estatua sin ser idéntica a ella, como el papel constituye el billete. Dos cosas pueden coincidir si una constituye a la otra.' },
  laxo: { t: 'C', p: 'pers', n: 'Sentido laxo y estricto', by: 'Butler · Chisholm', fx: 'dist', d: 'En el habla corriente llamamos «el mismo» a lo que continúa a otro de manera adecuada. Eso basta para las promesas y las deudas, aunque estrictamente sea otro.' },

  /* ---------- modalidad ---------- */
  realismo_modal: { t: 'T', p: 'modal', n: 'Realismo modal', by: 'David Lewis', w: 1, d: 'Hay infinitos mundos tan reales y concretos como este. Algo es posible cuando ocurre en alguno de ellos. «Actual» solo significa «este en el que estoy».',
    cl: ['Existen infinitos mundos tan concretos como el nuestro.', 'Algo es posible si ocurre en algún mundo.', '«Actual» es un indexical, como «aquí».'], inc: ['Solo existe el mundo actual.', 'Los mundos posibles son descripciones o conjuntos de proposiciones.'] },
  ersatzismo: { t: 'T', p: 'modal', n: 'Actualismo', by: 'Plantinga · Stalnaker', w: 0, d: 'Solo existe el mundo actual. Los «mundos posibles» son representaciones abstractas de cómo podrían haber sido las cosas: historias completas y consistentes, no universos.',
    cl: ['Solo existe el mundo actual.', 'Un mundo posible es una representación abstracta, completa y consistente.', 'Tú mismo, y no un doble, podrías haber sido distinto.'], inc: ['Existen burros parlantes de carne y hueso.', 'Los mundos posibles son universos concretos.'] },
  ficc_modal: { t: 'T', p: 'modal', n: 'Ficcionalismo modal', by: 'Gideon Rosen', w: -1, d: 'Hablar de mundos posibles es usar una ficción útil. «Es posible que p» significa «según la ficción de los mundos, hay un mundo donde p». No hay que creer en ellos.',
    cl: ['Los mundos posibles son una ficción útil.', '«Posible» significa «verdadero en algún mundo, según la ficción».', 'No existe ningún mundo aparte del actual.'], inc: ['Existen infinitos universos concretos.', 'Hay objetos abstractos que representan cada posibilidad.'] },
  mirada: { t: 'A', p: 'modal', n: 'La mirada incrédula', d: '¿De verdad existen dragones, burros parlantes y un doble tuyo que es astronauta, todos de carne y hueso? Nadie puede creer eso seriamente.',
    vs: { realismo_modal: 1 }, pro: ['ersatzismo', 'ficc_modal'], rep: ['virtudes'] },
  humphrey: { t: 'A', p: 'modal', n: 'La objeción de Humphrey', by: 'Saul Kripke', d: 'A Humphrey le importa que *él* pudo haber ganado la elección. Le daría igual saber que otra persona, parecida a él y en otro universo, la ganó.',
    vs: { realismo_modal: 2 }, pro: ['ersatzismo'], rep: ['contraparte'] },
  aislados: { t: 'A', p: 'modal', n: 'Mundos inalcanzables', d: 'Los otros mundos no tienen ninguna conexión causal ni espacial con el nuestro. ¿Cómo sabríamos algo sobre lo que ocurre en ellos? Y, sin embargo, sabemos qué es posible.',
    vs: { realismo_modal: 2 }, pro: ['ersatzismo', 'ficc_modal'], rep: ['apriori'] },
  circular: { t: 'A', p: 'modal', n: 'Circularidad', by: 'David Lewis', d: 'El actualista dice que un mundo es una historia completa y *consistente*. Pero «consistente» quiere decir «que *podría* ser verdadera»: usa la posibilidad para explicar la posibilidad.',
    vs: { ersatzismo: 2 }, pro: ['realismo_modal'], rep: ['primitivo'] },
  paraiso: { t: 'A', p: 'modal', n: 'El paraíso de los filósofos', by: 'David Lewis', d: 'Con mundos concretos se analizan sin residuo la posibilidad, la necesidad, los contrafácticos, las propiedades y las proposiciones. Tanto poder explicativo es razón para creer en ellos.',
    vs: { ersatzismo: 1, ficc_modal: 1 }, pro: ['realismo_modal'], rep: [] },
  brockrosen: { t: 'A', p: 'modal', n: 'La ficción se muerde la cola', by: 'Brock · Rosen', d: 'Según la ficción, en todo mundo es verdad que hay muchos mundos. Por tu propio análisis, eso significa que *necesariamente* hay muchos mundos. Acabas de afirmar lo que negabas.',
    vs: { ficc_modal: 2 }, pro: ['realismo_modal', 'ersatzismo'], rep: [] },
  ficcion1986: { t: 'A', p: 'modal', n: 'Una ficción reciente', d: 'La ficción de los mundos se escribió en el siglo XX. Si lo posible depende de lo que dice esa historia, ¿nada era posible antes de que alguien la escribiera?',
    vs: { ficc_modal: 2 }, pro: ['realismo_modal', 'ersatzismo'], rep: [] },
  mundo: { t: 'C', p: 'modal', n: 'Mundo posible', by: 'Leibniz · Kripke', fx: 'prec', d: 'Una manera completa en que las cosas podrían haber sido. Necesario: verdadero en todos los mundos. Posible: verdadero en al menos uno.' },
  dere: { t: 'C', p: 'modal', n: 'De re y de dicto', fx: 'heal', d: 'De dicto: «necesariamente, el ganador gana». De re: «el ganador *mismo* no podría haber perdido». La primera es trivial; la segunda es falsa.' },
  contraparte: { t: 'C', p: 'modal', n: 'Contraparte', by: 'David Lewis', fx: 'dist', d: 'Nadie está en dos mundos. Que *tú* pudieras ser astronauta es que alguien muy semejante a ti, en otro mundo, lo sea: eso es justamente lo que hace verdadero algo sobre ti.' },
  primitivo: { t: 'C', p: 'modal', n: 'Primitivo teórico', fx: 'dist', d: 'Toda teoría deja algo sin analizar. Tomar la posibilidad como noción básica es un precio razonable por una ontología sobria.' },

  /* ---------- composición ---------- */
  nihilismo_mer: { t: 'T', p: 'comp', n: 'Nihilismo mereológico', by: 'Unger · Dorr', w: -1, d: 'Nunca varias cosas componen otra. Solo existen partículas sin partes. No hay mesas: hay partículas dispuestas en forma de mesa.',
    cl: ['Solo existen cosas simples, sin partes.', 'No hay mesas: hay partículas dispuestas en forma de mesa.', 'Nunca varias cosas componen otra.'], inc: ['Existen los organismos vivos.', 'Tu nariz y la torre Eiffel componen un objeto.'] },
  universalismo_mer: { t: 'T', p: 'comp', n: 'Universalismo', by: 'Leśniewski · Lewis', w: 1, d: 'Cualesquiera cosas, por dispersas que estén, componen algo. Existe el objeto formado por tu nariz y la torre Eiffel, aunque casi nunca hablemos de él.',
    cl: ['Cualesquiera cosas componen algo.', 'Tu nariz y la torre Eiffel componen un objeto.', 'La composición nunca falla.'], inc: ['No existen las mesas.', 'Solo las cosas que están bien unidas componen algo.'] },
  organicismo: { t: 'T', p: 'comp', n: 'Organicismo', by: 'Peter van Inwagen', w: 0, d: 'Varias cosas componen algo solo cuando su actividad constituye una vida. Existen las partículas y los organismos; no existen las mesas ni las piedras.',
    cl: ['Varias cosas componen algo solo si constituyen una vida.', 'Existen los gatos, pero no las mesas.', 'Yo soy un organismo compuesto.'], inc: ['Solo existen partículas sin partes.', 'Tu nariz y la torre Eiffel componen un objeto.'] },
  sentidocomun: { t: 'T', p: 'comp', n: 'Composición moderada', by: 'Markosian · Korman', w: 0, d: 'A veces hay composición y a veces no, tal como creemos corrientemente. Hay mesas, gatos y montañas; no hay objetos hechos de una nariz y una torre.',
    cl: ['Hay mesas, gatos y montañas.', 'No existe un objeto hecho de tu nariz y la torre Eiffel.', 'Solo algunas pluralidades componen algo.'], inc: ['Cualesquiera cosas componen algo.', 'No existen las mesas.'] },
  vaguedad: { t: 'A', p: 'comp', n: 'Argumento de la vaguedad', by: 'Lewis · Sider', d: 'Si solo a veces hay composición, habrá casos dudosos. Pero no puede ser dudoso *cuántas cosas hay*. Luego no hay límite: o la composición ocurre siempre, o no ocurre nunca.',
    vs: { sentidocomun: 2, organicismo: 2 }, pro: ['universalismo_mer', 'nihilismo_mer'], rep: ['bruto'] },
  extranos: { t: 'A', p: 'comp', n: 'Objetos extraños', d: '¿Existe la «truchapavo», hecha de la mitad delantera de una trucha y la trasera de un pavo? ¿Y la suma de tu nariz y la torre Eiffel? Nadie cuenta esas cosas al hacer inventario.',
    vs: { universalismo_mer: 2 }, pro: ['sentidocomun', 'organicismo', 'nihilismo_mer'], rep: ['cuantificador'] },
  sobredetmer: { t: 'A', p: 'comp', n: 'La pelota sobra', by: 'Trenton Merricks', d: 'Los átomos dispuestos en forma de pelota ya bastan para romper la ventana. Si además existiera la pelota, la rotura tendría dos causas completas. La pelota no hace ningún trabajo.',
    vs: { sentidocomun: 2, universalismo_mer: 2 }, pro: ['nihilismo_mer', 'organicismo'], rep: ['compid'] },
  cogito: { t: 'A', p: 'comp', n: 'Pienso, luego hay compuestos', by: 'Peter van Inwagen', d: 'Yo existo y yo pienso. Pero no soy una partícula simple. Luego existe al menos una cosa compuesta: yo.',
    vs: { nihilismo_mer: 2 }, pro: ['organicismo', 'sentidocomun', 'universalismo_mer'], rep: ['paraf'] },
  gunk: { t: 'A', p: 'comp', n: 'Materia sin fondo', by: 'Theodore Sider', d: 'Podría ser que toda parte tuviera partes más pequeñas, sin llegar nunca a partículas simples. Si solo existieran los simples, en ese mundo no existiría nada.',
    vs: { nihilismo_mer: 2, organicismo: 1 }, pro: ['universalismo_mer', 'sentidocomun'], rep: [] },
  arbitrario: { t: 'A', p: 'comp', n: 'Frontera arbitraria', d: '¿Por qué las células de un gato componen algo y los ladrillos de una casa bien construida no? La frontera parece trazada a nuestra medida, no a la del mundo.',
    vs: { organicismo: 2, sentidocomun: 1 }, pro: ['universalismo_mer', 'nihilismo_mer'], rep: [] },
  moore: { t: 'A', p: 'comp', n: 'Hecho de sentido común', by: 'G. E. Moore', d: 'Estoy más seguro de que aquí hay una mesa que de cualquier premisa filosófica que lo niegue. Si un argumento concluye que no hay mesas, alguna premisa es falsa.',
    vs: { nihilismo_mer: 1, organicismo: 1 }, pro: ['sentidocomun', 'universalismo_mer'], rep: ['paraf'] },
  composicion: { t: 'C', p: 'comp', n: 'Cuestión de la composición', by: 'Peter van Inwagen', fx: 'prec', d: 'La cuestión especial de la composición: ¿bajo qué condiciones varias cosas componen otra? Respuestas posibles: nunca, siempre o solo a veces.' },
  cuantificador: { t: 'C', p: 'comp', n: 'Restricción del cuantificador', by: 'David Lewis', fx: 'dist', d: 'Al decir «no hay cerveza» hablamos solo de la nevera. Del mismo modo, al hacer inventario ignoramos las sumas extrañas; no por eso dejan de existir.' },
  compid: { t: 'C', p: 'comp', n: 'Composición como identidad', fx: 'dist', d: 'El todo no es algo *además* de sus partes: es ellas mismas, tomadas en conjunto. Por eso no compite con ellas ni hay doble causa.' },
  bruto: { t: 'C', p: 'comp', n: 'Hecho bruto', by: 'Ned Markosian', fx: 'dist', d: 'Puede haber un límite exacto que ninguna teoría explica: simplemente está ahí. Que no sepamos dónde está no prueba que no exista.' },

  /* ---------- libre albedrío ---------- */
  det_duro: { t: 'T', p: 'lib', n: 'Determinismo duro', by: 'Holbach · Laplace', w: -1, d: 'Todo suceso está fijado por el pasado y las leyes de la naturaleza. Como la libertad exige poder hacer otra cosa, nadie es libre ni, en rigor, responsable.',
    cl: ['Todo suceso está determinado por el pasado y las leyes.', 'La libertad es incompatible con el determinismo.', 'Nadie actúa libremente.'], inc: ['Somos responsables de nuestros actos.', 'Se puede ser libre en un mundo determinado.'] },
  libertarismo: { t: 'T', p: 'lib', n: 'Libertarismo', by: 'Reid · Chisholm · Kane', w: 1, d: 'Somos libres y la libertad exige alternativas reales. Por tanto, el determinismo es falso: algunas decisiones no están fijadas por el pasado.',
    cl: ['Al menos algunos actos son libres.', 'La libertad es incompatible con el determinismo.', 'No todas nuestras decisiones están fijadas por el pasado.'], inc: ['Todo suceso está determinado por el pasado y las leyes.', 'Se puede ser libre en un mundo determinado.'] },
  compatibilismo: { t: 'T', p: 'lib', n: 'Compatibilismo', by: 'Hume · Frankfurt', w: 0, d: 'Ser libre no es escapar de las causas: es actuar según los propios deseos y razones, sin coacción. Eso es posible aunque todo esté determinado.',
    cl: ['Se puede ser libre en un mundo determinado.', 'Ser libre es actuar por los propios deseos, sin coacción.', 'Somos responsables de nuestros actos.'], inc: ['La libertad exige que el determinismo sea falso.', 'Nadie actúa libremente.'] },
  consecuencia: { t: 'A', p: 'lib', n: 'Argumento de la consecuencia', by: 'Peter van Inwagen', d: 'Si el determinismo es verdadero, mis actos se siguen de las leyes y del pasado remoto. No depende de mí el pasado ni dependen de mí las leyes. Luego mis actos tampoco dependen de mí.',
    vs: { compatibilismo: 2 }, pro: ['det_duro', 'libertarismo'], rep: ['condicional'] },
  manipulacion: { t: 'A', p: 'lib', n: 'Argumento de la manipulación', by: 'Derk Pereboom', d: 'Un neurocientífico programa a Plum para que desee robar y actúe «según sus propios deseos». Plum no es libre. Pero el determinismo hace lo mismo que el neurocientífico, solo que sin intención.',
    vs: { compatibilismo: 2 }, pro: ['det_duro', 'libertarismo'], rep: [] },
  azar: { t: 'A', p: 'lib', n: 'Objeción del azar', d: 'Si mi decisión no está determinada por nada —ni siquiera por mis razones y mi carácter—, ocurre por azar. Y un acto azaroso no es más libre ni más mío que un tic nervioso.',
    vs: { libertarismo: 2 }, pro: ['compatibilismo', 'det_duro'], rep: ['agente'] },
  basico: { t: 'A', p: 'lib', n: 'El argumento básico', by: 'Galen Strawson', d: 'Actúas como actúas por cómo eres. Para ser responsable de tus actos tendrías que ser responsable de cómo eres; para eso, haberte elegido a ti mismo; y así sin fin. Nadie es causa de sí.',
    vs: { libertarismo: 2, compatibilismo: 1 }, pro: ['det_duro'], rep: [] },
  frankfurt: { t: 'A', p: 'lib', n: 'Los casos Frankfurt', by: 'Harry Frankfurt', d: 'Black vigila a Jones: si Jones dudara, lo forzaría a votar por A. Jones vota por A por su cuenta y Black no interviene. Jones no podía hacer otra cosa y, aun así, es responsable.',
    vs: { det_duro: 2, libertarismo: 1 }, pro: ['compatibilismo'], rep: [] },
  reactivas: { t: 'A', p: 'lib', n: 'Actitudes reactivas', by: 'P. F. Strawson', d: 'El resentimiento, la gratitud y el perdón son parte de toda vida humana y presuponen responsabilidad. Ninguna tesis metafísica podría hacernos abandonarlos, ni deberíamos quererlo.',
    vs: { det_duro: 2 }, pro: ['compatibilismo', 'libertarismo'], rep: [] },
  deliberar: { t: 'A', p: 'lib', n: 'La experiencia de elegir', d: 'Cuando delibero, experimento que varias opciones están realmente abiertas y que la decisión depende de mí. Negarlo es negar el dato más cercano que tenemos.',
    vs: { det_duro: 1 }, pro: ['libertarismo'], rep: [] },
  determinismo: { t: 'C', p: 'lib', n: 'Determinismo', by: 'Laplace', fx: 'prec', d: 'Dado el estado del mundo en un momento y las leyes de la naturaleza, solo hay un futuro posible. El demonio de Laplace podría calcularlo todo.' },
  ppa: { t: 'C', p: 'lib', n: 'Posibilidades alternativas', fx: 'heal', d: 'Principio: alguien es responsable de lo que hizo solo si pudo haber hecho otra cosa. Casi todo el debate depende de aceptarlo o rechazarlo.' },
  condicional: { t: 'C', p: 'lib', n: 'Análisis condicional', by: 'Hume · Moore', fx: 'dist', d: '«Pude hacer otra cosa» significa «habría hecho otra cosa *si lo hubiera querido*». Eso es verdad aunque mi querer esté determinado.' },
  agente: { t: 'C', p: 'lib', n: 'Causación agente', by: 'Reid · Chisholm', fx: 'dist', d: 'No todo lo causa un suceso anterior: a veces la causa es el agente mismo, que inicia una cadena nueva. Eso no es azar: es autoría.' },

  /* ---------- metaontología ---------- */
  quineanismo: { t: 'T', p: 'meta', n: 'Ontología quineana', by: 'W. V. O. Quine', w: 0, d: 'La pregunta ontológica es «¿qué hay?», y se responde mirando sobre qué cuantifican nuestras mejores teorías. «Existir» tiene un solo sentido y las disputas son sustantivas.',
    cl: ['La ontología pregunta qué hay.', 'Existe aquello sobre lo que cuantifican nuestras mejores teorías.', '«Existir» tiene un solo sentido.'], inc: ['Las preguntas ontológicas carecen de sentido teórico.', 'Que algo exista es trivial; lo que importa es qué fundamenta qué.'] },
  deflacionismo: { t: 'T', p: 'meta', n: 'Deflacionismo', by: 'Carnap · Hirsch', w: -1, d: 'Dentro de un marco lingüístico, «¿hay números?» se responde trivialmente. Fuera de todo marco, la pregunta no tiene sentido teórico: solo cabe elegir qué lenguaje nos conviene.',
    cl: ['Dentro de un marco, las preguntas de existencia son triviales.', 'Fuera de todo marco, no tienen contenido teórico.', 'Elegir un marco es una decisión práctica.'], inc: ['Hay una respuesta profunda a qué existe realmente.', 'Hay una única manera correcta de dividir la realidad.'] },
  neoaristotelismo: { t: 'T', p: 'meta', n: 'Neoaristotelismo', by: 'Fine · Schaffer', w: 1, d: 'Que existan números o mesas es casi trivial. La pregunta profunda es otra: qué es fundamental y qué se fundamenta en qué. La realidad tiene niveles.',
    cl: ['Las preguntas de existencia se responden fácilmente.', 'La tarea de la metafísica es decir qué fundamenta qué.', 'La realidad tiene una estructura jerárquica.'], inc: ['La ontología termina en la lista de lo que hay.', 'Las preguntas metafísicas son solo decisiones sobre el lenguaje.'] },
  internoexterno: { t: 'A', p: 'meta', n: 'Interno y externo', by: 'Rudolf Carnap', d: 'Preguntar «¿hay números?» dentro de la aritmética es trivial: claro que sí. Preguntarlo desde fuera, «¿pero existen *de verdad*?», no tiene método de respuesta: es una pseudopregunta.',
    vs: { quineanismo: 2, neoaristotelismo: 1 }, pro: ['deflacionismo'], rep: ['holismo'] },
  verbal: { t: 'A', p: 'meta', n: 'Disputa verbal', by: 'Eli Hirsch', d: 'El nihilista y el universalista coinciden en todos los hechos. Cada uno usa «existe» con otro sentido, y en el suyo dice la verdad. No discuten sobre el mundo, sino sobre palabras.',
    vs: { quineanismo: 2, neoaristotelismo: 1 }, pro: ['deflacionismo'], rep: ['ontologues'] },
  dosdogmas: { t: 'A', p: 'meta', n: 'Dos dogmas', by: 'W. V. O. Quine', d: 'Separar las preguntas «de marco» de las «de hecho» supone separar lo analítico de lo sintético. Pero esa frontera no puede trazarse: toda creencia enfrenta la experiencia en bloque.',
    vs: { deflacionismo: 2 }, pro: ['quineanismo'], rep: [] },
  autorref: { t: 'A', p: 'meta', n: 'Criterio que se refuta', d: 'El criterio «solo tiene sentido lo verificable o lo analítico» no es verificable ni analítico. Por su propia vara, la tesis de que la metafísica carece de sentido carece de sentido.',
    vs: { deflacionismo: 2 }, pro: ['quineanismo', 'neoaristotelismo'], rep: ['tolerancia'] },
  baratas: { t: 'A', p: 'meta', n: 'Existencia barata', by: 'Jonathan Schaffer', d: '«Hay números primos; luego hay números.» Las preguntas de existencia se responden en una línea. Si la ontología fuera solo eso, sería trivial: lo interesante es qué es fundamental.',
    vs: { quineanismo: 2, deflacionismo: 1 }, pro: ['neoaristotelismo'], rep: [] },
  oscura: { t: 'A', p: 'meta', n: 'Una noción oscura', by: 'Jessica Wilson · Hofweber', d: '«Fundamentar» junta bajo un nombre cosas tan distintas como componer, causar, realizar y determinar. No es una noción clara y unitaria: es una etiqueta para un montón.',
    vs: { neoaristotelismo: 2 }, pro: ['quineanismo', 'deflacionismo'], rep: ['fundamentacion'] },
  marco: { t: 'C', p: 'meta', n: 'Marco lingüístico', by: 'Rudolf Carnap', fx: 'prec', d: 'Un sistema de reglas para hablar de cierto tipo de entidades: números, cosas, propiedades. Dentro de él, la existencia de esas entidades se sigue de las reglas.' },
  holismo: { t: 'C', p: 'meta', n: 'Holismo', by: 'W. V. O. Quine', fx: 'dist', d: 'Nuestras teorías se confirman como un todo. Si la ciencia confirma una teoría que cuantifica sobre números, confirma los números igual que los electrones: no hay «afuera» del marco.' },
  ontologues: { t: 'C', p: 'meta', n: 'Ontologués', by: 'Theodore Sider', fx: 'dist', d: 'Entre todos los sentidos posibles de «existe» hay uno privilegiado: el que corta la realidad por sus articulaciones. En ese idioma la disputa no es verbal.' },
  tolerancia: { t: 'C', p: 'meta', n: 'Principio de tolerancia', by: 'Rudolf Carnap', fx: 'dist', d: 'No se afirma una tesis: se propone un lenguaje. Y las propuestas no son verdaderas ni falsas, sino más o menos útiles.' },
  fundamentacion: { t: 'C', p: 'meta', n: 'Fundamentación', by: 'Kit Fine', fx: 'dist', d: 'Relación por la que unos hechos se dan *en virtud de* otros. El conjunto {Sócrates} existe porque existe Sócrates, y no al revés, aunque ninguno pueda existir sin el otro.' }
};

/* definición de un mapa por su id: una región o el interior de su ágora («gym:<región>») */
function MAPDEF(id) {
  if (id.indexOf('gym:') === 0) {
    const r = REG.find(x => x.id === id.slice(4));
    return { id, n: 'ÁGORA DE ' + r.n, k: r.k, prob: r.prob, song: 'gym', inside: r.id, rows: GYM,
      npcs: { v: { ch: BT[r.gym.v].ch, d: 'left', bt: r.gym.v, sight: 3 }, l: { ch: BT[r.gym.l].ch, d: 'down', bt: r.gym.l } }, items: [], houses: {} };
  }
  return REG.find(x => x.id === id);
}

/* de dónde sale cada carta; lo que no tiene otra fuente vive en la hierba alta de su región */
const WILD = {};
(function () {
  const src = { compromiso: 1, paraf: 1 };
  REG.forEach(r => {
    (r.items || []).forEach(c => { src[c] = 1; });
    if (r.guide) r.guide.offer.concat(r.guide.gift).forEach(c => { src[c] = 1; });
    Object.keys(r.npcs).forEach(k => { if (r.npcs[k].gift) src[r.npcs[k].gift] = 1; });
  });
  Object.keys(BT).forEach(k => { src[BT[k].th] = 1; (BT[k].rw || []).forEach(c => { src[c] = 1; }); });
  Object.keys(CARDS).forEach(id => { if (!src[id]) (WILD[CARDS[id].p] = WILD[CARDS[id].p] || []).push(id); });
})();

/* Metafísica Advance — motor: mapa, diálogos, menús, disputas e ideas salvajes.
   Los guiones (diálogos, disputas) son funciones async: esperan a que el jugador pulse un botón o elija una opción. */
(function () {
'use strict';
const AU = window.FAudio, G = GFX;
const FAST = () => !!window.MA_FAST;      // pruebas: sin esperas ni animaciones
const KEY = 'metafisica-advance-v1';
const ORDER = REG.map(r => r.id);
const DIRS = ['up', 'down', 'left', 'right'], DV = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }, OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };
const SOLID = 'T~#oSDWc';
const $ = (s, r) => (r || document).querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const wait = ms => new Promise(r => setTimeout(r, FAST() ? 0 : ms));
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const fmt = s => esc(s).split('*').map((p, i) => (i % 2 ? '<b>' + p + '</b>' : p)).join('');

  xp: 0, hp: 100, resp: { map: 'umbral', x: 10, y: 4 }, ret: null, mv: 0.1, sv: 0.7 });
let S = fresh();
try { const o = JSON.parse(localStorage.getItem(KEY) || 'null'); if (o && o.v === 1) S = Object.assign(fresh(), o); } catch (e) { /* sin almacenamiento */ }
function save() {
  if (M && mode === 'world') { S.map = M.id; S.x = P.x; S.y = P.y; S.dir = P.dir; }
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* sin almacenamiento */ }
}
const level = () => 1 + Math.floor(Math.sqrt(S.xp / 40));
function system() {
  const th = Object.keys(S.pos).map(k => S.pos[k]), has = p => th.includes(p[0]) && th.includes(p[1]);
  const syn = SYS.syn.filter(has), ten = SYS.ten.filter(has);
  return { syn, ten, bonus: 4 * (syn.length - ten.length) };
}
const maxHp = () => 100 + 6 * (level() - 1) + system().bonus;
function epithet() {
  const th = Object.keys(S.pos).map(k => CARDS[S.pos[k]]);
  if (!th.length) return 'Sin posturas todavía';
  const r = th.reduce((a, c) => a + (c.w || 0), 0) / th.length, b = system().bonus;
  return (r <= -.4 ? 'Ontología de desierto' : r >= .4 ? 'Ontología de selva' : 'Ontología de jardín') + (b > 0 ? ', bien trabada' : b < 0 ? ', con grietas' : '');
}

/* tamaño de la vista en píxeles de juego: apaisada 240×160 (30×20 em) o, en pantallas verticales, 160×240 (20×30 em),
   que deja la letra bastante más grande */
let VW = 240, VH = 160;
function fit() {
  const w = app.clientWidth, h = app.clientHeight;
  if (w < 40 || h < 40) return;
  const wide = Math.min(w, h * 1.5) / 30, high = Math.min(w, h * 2 / 3) / 20, tall = high > wide * 1.15;
  stage.classList.toggle('tall', tall);
  stage.style.fontSize = (tall ? high : wide).toFixed(2) + 'px';
  const vw = tall ? 160 : 240, vh = tall ? 240 : 160;
  if (vw !== VW || vh !== VH || ctx.canvas.width !== vw) {
    VW = vw; VH = vh;
    [ctx.canvas, fctx.canvas].forEach(c => { c.width = VW; c.height = VH; });
  }
}
function hud() {
  if (!M) return;
  $('.loc', hudEl).textContent = M.def.n;
  S.hp = Math.min(S.hp, maxHp());
  $('.aut', hudEl).textContent = 'AUT ' + Math.max(0, Math.ceil(S.hp)) + '/' + maxHp() + ' · Nv ' + level();
